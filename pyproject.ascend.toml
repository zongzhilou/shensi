[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "shensi"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "verl",
    "verl-hardware-plugin",
    "megatron-core",
    "megatron-bridge",
    "transformer-engine",
    "vllm",
    "vllm-ascend",
    "vllm-plugin-fl",
    "transformers",
    "torch",
    "torch-npu",
    "triton-ascend",
    "flag-gems",
    "emerging-optimizers",
    "pytorch-optimizer",
    "optax",
    "ray[default]",
    "omegaconf",
    "pyarrow",
    "zstandard",
    "numpy",
]

[project.scripts]
shensi = "shensi:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
no-build-isolation-package = ["transformer-engine", "transformer-engine-torch"]
override-dependencies = ["transformers>=5.18"]

[tool.uv.extra-build-dependencies]
transformer-engine = ["setuptools", "wheel"]
transformer-engine-torch = ["setuptools", "wheel", "cmake"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "flagos-ascend"
url = "https://resource.flagos.net/repository/flagos-pypi-ascend/simple"
explicit = true

[[tool.uv.index]]
name = "ascend-huawei"
url = "https://mirrors.huaweicloud.com/ascend/repos/pypi"
explicit = true

[tool.uv.sources]
verl = { path = "3rdparty/common/verl" }
verl-hardware-plugin = { path = "3rdparty/common/verl-hardware-plugin" }
megatron-core = { index = "flagos-ascend" }
megatron-bridge = { path = "3rdparty/common/Megatron-Bridge" }
transformer-engine = { path = "3rdparty/ascend/TransformerEngine-FL" }
vllm = { path = "3rdparty/common/vllm" }
vllm-plugin-fl = { path = "3rdparty/common/vllm-plugin-FL" }
transformers = { path = "3rdparty/common/transformers" }
flag-gems = { path = "3rdparty/common/FlagGems" }
torch = { index = "pytorch-cpu" }
triton-ascend = { index = "ascend-huawei" }
vllm-ascend = { index = "ascend-huawei" }

[tool.uv.build-backend]
module-root = "src"
module-name = ["shensi", "megatron_ext", "flagscale_ext"]

[tool.ruff]
target-version = "py311"
line-length = 119
exclude = ["src/megatron_ext", "src/flagscale_ext", "src/shensi/recipes/shensi/stage2_rl/agentworld", "src/shensi/recipes/shensi/stage1_sft/encoding_dsv4.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D101", "D103"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "D104"]
"src/shensi/recipes/**" = ["D101", "D103"]
"src/shensi/utils/**" = ["D101", "D103"]
"src/shensi/__init__.py" = ["D103"]

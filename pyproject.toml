[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "shensi"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "verl",
    "verl-hardware-plugin",
    "megatron-core",
    # `megatron-bridge` 刻意不写在这里：它自己的 pyproject 把 megatron-core 指到未初始化的子模块
    # （`3rdparty/Megatron-LM/`），走 uv 解算会直接失败。装法见 README 的"快速开始"：
    #   uv sync && uv pip install --no-deps -e <本仓的 Megatron-Bridge 检出>
    "transformer-engine[pytorch]",
    "vllm",
    "transformers",
    "torch",
    "emerging-optimizers",
    "pytorch-optimizer",
    # mcore 的 `core/datasets/Makefile` 要 pybind11 的头文件（运行时编译 dataset helper 用），
    # 编 C++/CUDA 扩展（fast-hadamard-transform）走 ninja
    "pybind11",
    "ninja",
    # DSA indexer 的 Hadamard 旋转（mcore 的硬依赖；CUDA 扩展，装的时候要能编）
    "fast-hadamard-transform",
    "optax",
    "ray[default]",
    "omegaconf",
    "pyarrow",
    "zstandard",
    "numpy",
    "cmake",
]

[project.scripts]
shensi = "shensi:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
override-dependencies = ["transformers>=5.18", "flashinfer-python==0.7.0.post1",
                         "datasets>=3", "pyyaml>=6.0.2"]

[tool.uv.extra-build-dependencies]
# 它的 setup.py 要 import torch 才能算出 CUDA 编译参数，但没把 torch 写进 build-system.requires
fast-hadamard-transform = ["torch", "ninja", "packaging"]
# vllm 的 CMake 在隔离构建环境里找不到 `ninja`（本机实测：
# `CMake Error: Running '<build env>/bin/ninja' '--version' failed: no such file or directory`），
# 这里把它 declared 的构建期依赖再显式列一遍；本机实际是用 `--no-build-isolation` 编的（见 README）
vllm = [
    "ninja",
    "cmake",
    "packaging",
    "setuptools",
    "setuptools-scm",
    "setuptools-rust",
    "wheel",
    "jinja2",
]

[tool.uv.extra-build-variables]
# vllm 的版本号由 vcs-versioning 从 fork 的 git tag 算：我们的 fork 只推了分支（没有 tag），
# 它会退化成 `0.1.dev22167+g<sha>`，而 verl 的版本闸门要求 >=0.18.0，直接拒。用 vllm 官方支持的
# VLLM_VERSION_OVERRIDE 固定成"基线 tag + 距离 + 提交"（= fork 若带上游 tag 时它自己会算出的串；
# 见 setup.py::get_vllm_version）。fork 前进后按
#   git describe --tags --long --match 'v[0-9]*'   （需先把上游 tag 拉进来）
# 重算这个串。
vllm = { VLLM_VERSION_OVERRIDE = "0.30.1rc0.dev360+g54c5060a1" }
# 从 git 源码编 TE 时默认会去编 NCCL EP 子模块（uv 的 git checkout 不 init 子模块，必然失败）；
# 训练用不到它，按上游文档的开关关掉（setup.py：`Set NVTE_WITH_NCCL_EP=0 to force off`）
transformer-engine = { NVTE_WITH_NCCL_EP = "0" }
transformer-engine-torch = { NVTE_WITH_NCCL_EP = "0" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
# 上游 Megatron-LM（main）与 Megatron-Bridge（本仓 3rdparty 里的检出，shensi 模型就在它的
# src/megatron/bridge/models/shensi/ 里）按可编辑方式装：mcore 的 `core/datasets/Makefile`
# 不进 wheel，而 `compile_helpers()` 会在运行时 `make -C <包目录>`（缺 Makefile 直接 sys.exit）；
# 顺带让 3rdparty 里的改动即时生效，不用再往 site-packages 里塞符号链接。
megatron-core = { path = "3rdparty/common/Megatron-LM", editable = true }
# mcore 钉的那个 rev（PyPI 上的 1.0.4.post1 与上游不一致）
fast-hadamard-transform = { git = "https://github.com/Dao-AILab/fast-hadamard-transform.git", rev = "f134af63deb2df17e1171a9ec1ea4a7d8604d5ca" }
# 上游 TransformerEngine（不用 FL fork）：PyPI 上 `transformer-engine-torch` 的 sdist 编不动
# （缺 build_tools），走 git 源码树就正常。rev 与 Megatron-Bridge 钉的同一个。
transformer-engine = { git = "https://github.com/NVIDIA/TransformerEngine.git", rev = "5e52befd5262c06289106338c308079d6adb391f" }
verl = { path = "3rdparty/common/verl" }
verl-hardware-plugin = { path = "3rdparty/common/verl-hardware-plugin" }
vllm = { path = "3rdparty/common/vllm" }
transformers = { path = "3rdparty/common/transformers" }

[tool.uv.build-backend]
module-root = "src"
module-name = ["shensi"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["3rdparty", "tools"]

[tool.ruff.lint]
# 与 vllm 的 lint 集合一致
select = ["D", "E", "F", "UP", "B", "ISC", "SIM", "I", "G", "INP"]
ignore = [
    # 不强制"每个东西都要有 docstring"
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # 与 vllm 同样的取舍
    "D205", "D209", "D301", "D400", "D401", "D404", "D415",
    "D203", "D213",
    "F405", "F403", "E731", "B905", "B007", "UP032",
    # 中文注释不强制折行（代码行宽由 ruff format 保证）
    "E501",
]

[tool.ruff.lint.pydocstyle]
ignore-var-parameters = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# 这两块是外部来源：世界模型那套（agentworld）与 DSV4 的编码实现，不改它们的风格
"src/shensi/recipes/shensi/stage2_rl/agentworld/**" = ["ALL"]
"src/shensi/recipes/shensi/stage1_sft/encoding_dsv4.py" = ["ALL"]

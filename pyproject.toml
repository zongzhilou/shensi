[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "shensi"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "verl",
    "verl-hardware-plugin",
    "megatron-core",
    "transformer-engine[pytorch]",
    "vllm",
    "vllm-plugin-fl",
    "transformers",
    "torch",
    "flag-gems",
    "emerging-optimizers",
    "pytorch-optimizer",
    "optax",
    "ray[default]",
    "omegaconf",
    "pyarrow",
    "zstandard",
    "numpy",
    "cmake",
]

[project.scripts]
shensi = "shensi:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
no-build-isolation-package = ["transformer-engine", "transformer-engine-torch"]
override-dependencies = ["transformers>=5.18", "flashinfer-python==0.7.0.post1",
                         "datasets>=3", "pyyaml>=6.0.2"]

[tool.uv.extra-build-dependencies]
transformer-engine = ["setuptools>=61", "cmake>=3.21", "wheel", "ninja", "pybind11[global]"]
transformer-engine-torch = ["setuptools>=80,<81", "wheel", "cmake", "ninja"]

[tool.uv.extra-build-variables]
transformer-engine = { CPATH = "/home/louzo/code/shensi/shensi/.venv/lib/python3.12/site-packages/nvidia/nccl/include", LIBRARY_PATH = "/home/louzo/code/shensi/shensi/.venv/nccl-dev/lib", NCCL_HOME = "/home/louzo/code/shensi/shensi/.venv/nccl-dev", NVTE_CMAKE_EXTRA_ARGS = "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON", CUDACXX = "/usr/local/cuda/bin/nvcc", NVTE_WITH_NCCL_EP = "0" }
transformer-engine-torch = { CPATH = "/home/louzo/code/shensi/shensi/.venv/lib/python3.12/site-packages/nvidia/nccl/include", NVTE_CMAKE_EXTRA_ARGS = "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON", CUDACXX = "/usr/local/cuda/bin/nvcc", NVTE_WITH_NCCL_EP = "0", NVTE_PYTORCH_FORCE_BUILD = "TRUE" }
# vllm 的版本号由 vcs-versioning 从 fork 的 git tag 算：我们的 fork 只推了分支（没有 tag），
# 它会退化成 `0.1.dev22167+g<sha>`，而 verl 的版本闸门要求 >=0.18.0，直接拒。用 vllm 官方支持的
# VLLM_VERSION_OVERRIDE 固定成"基线 tag + 距离 + 提交"（= fork 若带上游 tag 时它自己会算出的串；
# 见 setup.py::get_vllm_version）。fork 前进后按
#   git describe --tags --long --match 'v[0-9]*'   （需先把上游 tag 拉进来）
# 重算这个串。
vllm = { VLLM_VERSION_OVERRIDE = "0.30.1rc0.dev360+g54c5060a1" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flagos"
url = "https://resource.flagos.net/repository/flagos-pypi-hosted/simple"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
transformer-engine = { path = "3rdparty/ascend/TransformerEngine-FL" }
verl = { path = "3rdparty/common/verl" }
verl-hardware-plugin = { path = "3rdparty/common/verl-hardware-plugin" }
megatron-core = { path = "3rdparty/common/Megatron-LM-FL" }
vllm = { path = "3rdparty/common/vllm" }
vllm-plugin-fl = { path = "3rdparty/common/vllm-plugin-FL" }
transformers = { path = "3rdparty/common/transformers" }
flag-gems = { path = "3rdparty/common/FlagGems" }

[tool.uv.build-backend]
module-root = "src"
module-name = ["shensi", "megatron_ext", "flagscale_ext"]

[tool.ruff]
target-version = "py312"
line-length = 119
exclude = ["src/megatron_ext", "src/flagscale_ext", "src/shensi/recipes/shensi/stage2_rl/agentworld", "src/shensi/recipes/shensi/stage1_sft/encoding_dsv4.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D101", "D103"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "D104"]
"src/shensi/recipes/**" = ["D101", "D103"]
"src/shensi/utils/**" = ["D101", "D103"]
"src/shensi/__init__.py" = ["D103"]

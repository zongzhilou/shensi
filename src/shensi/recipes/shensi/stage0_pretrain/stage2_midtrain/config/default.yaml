# stage2_midtrain：中训练 + DSA 引入（默认档 = sparse adaptation）。
# 几何/loss/优化器继承 stage1，这里只写"切稀疏 + 换序列长度 + 换 ckpt 出入口"的差异。
base: ../../stage1_pretrain/config

experiment:
  exp_name: shensi_stage2_sparse_adapt
  load: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage2_dsa_warmup
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage2_midtrain
  save_steps: 500

train:
  system:
    checkpoint:
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage2_midtrain
      load: ${experiment.load}
  model:
    seq_length: 32768
    # 切稀疏：indexer 参与（stage2 的 dsa_warmup 已把它训过），KL 目标改成 topk 集合（论文 Eq.4）
    csa_dense_mode: false
    dsa_indexer_use_sparse_loss: true
    shensi_indexer_loss_coeff: 0.01
    train_iters: 10000
    # 早停看门狗盯验证损失（validation loss）：中训练常开验证，20 个 batch 够稳又不拖慢
    eval_iters: 20
    eval_interval: 200
    optimizer:
      # --- 优化器：AdaMuon（矩阵腿）+ AdEMAMix（标量腿），与预训练各段同一套 ---
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix     # 换 GrokFastAdamW 就写 grokfastadamw
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18        # 两条腿共用一条 LR 曲线的归一系数
      clip_grad: 1.0
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.999
      ademamix_betas: [0.9, 0.999, 0.9999]
      ademamix_alpha: 5.0
      lr_scheduler:
        lr: 1.0e-5                # sparse adaptation 段常数 1e-5
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.0
        lr_decay_style: constant
  data:
    no_create_attention_mask_in_dataloader: true
    data_path: []

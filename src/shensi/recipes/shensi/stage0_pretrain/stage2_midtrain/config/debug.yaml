# 极小规模 + 真实数据（Nemotron 样例集）：本地单卡把 PT 管线跑通用的档。
# 几何与 src/flagscale_ext/examples/shensi/conf/train/tiny.yaml 一致，但数据换成 data_prep.py 产出的真实 bin/idx。
# 这里走家族默认的稀疏路径（csa_dense_mode=false）+ MTP 3 参数共享 + 三 loss 全开，
# 这样 SFT 极小档能直接接这个 ckpt（稠密档不构造 indexer，参数集不一样）。
base: default.yaml

experiment:
  exp_name: shensi_stage2_tiny_debug
  # 单卡调试：一个进程
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage2_tiny_debug
  save_steps: 5
  runner:
    per_node_task: false
    rdzv_backend: static
    hostfile: null
    nnodes: 1
    nproc_per_node: 1

train:
  system:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    use_distributed_optimizer: false
    overlap_grad_reduce: false      # 单进程/单卡：不需要 overlap（且它要求 distributed optimizer）
    overlap_param_gather: false
    checkpoint:
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage2_tiny_debug
      ckpt_format: torch_dist   # 与生产档同格式；SFT 极小档要能直接接这个 ckpt
      no_save_optim: true
      no_save_rng: true
    logging:
      log_interval: 1
  model:
    num_layers: 2
    mtp_num_layers: 3
    mtp_use_repeated_layer: true
    hidden_size: 128
    num_attention_heads: 4
    seq_length: 128
    max_position_embeddings: 128
    init_method_std: 0.02
    csa_dense_mode: false
    shensi_indexer_loss_coeff: 0.01
    shensi_compress_ratios: 4,128,0,0,0   # 前 2 项是主干（与 default 同序），后 3 项给共享的 MTP 层
    shensi_mlp_layer_types: hash_moe,moe
    shensi_head_dim: 64
    shensi_q_lora_rank: 64
    shensi_o_lora_rank: 32
    shensi_moe_intermediate_size: 32
    shensi_routed_expert_hidden_size: 32
    shensi_sliding_window: 64
    shensi_index_topk: 32
    shensi_index_n_heads: 8
    shensi_index_head_dim: 16
    shensi_num_experts: 8
    shensi_num_experts_per_tok: 2
    shensi_attn_res_block_size: 4
    shensi_partial_rotary_factor: 0.125
    shensi_hf_config: ""          # 极小档不与全量 config.json 对拍
    micro_batch_size: 1
    global_batch_size: 2
    train_iters: 5
    eval_iters: 0
    optimizer:
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 1.0e-4
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.0
        lr_decay_style: constant
  data:
    mock_data: false
    # 极小语料：valid/test 太小会让 mcore 的 sampler 断言 no sample to consume → 只切 train
    split: 100,0,0
    tokenizer:
      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: ${oc.env:SHENSI_TOKENIZER,${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/models/tiny-tok}
      vocab_size: 129280
      make_vocab_size_divisible_by: 128

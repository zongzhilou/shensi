# 极小规模 + 真实数据（Nemotron 样例集）：本地单卡把 PT 管线跑通用的档。
# 几何与 recipes/shensi/config/tiny.yaml 一致，但数据换成 data_prep.py 产出的真实 bin/idx。
# 这里走家族默认的稀疏路径（csa_dense_mode=false）+ 三 loss 全开，MTP 关掉（几何由 tiny_model.TINY
# 注入，mtp_num_layers 默认 0）；MTP 与 mHC 同开已打通（Bridge 侧有 mHC 感知的 MTP 层），
# 要试 MTP 就把 mtp_num_layers 设 1（极小档 1 / 2 层都真跑过）。
# 这样 SFT 极小档能直接接这个 ckpt（稠密档不构造 indexer，参数集不一样）。
base: default.yaml

experiment:
  exp_name: shensi_stage2_tiny_debug
  # 单卡调试：一个进程
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage2_tiny_debug
  save_steps: 5
  runner:
    nnodes: 1
    nproc_per_node: 1

train:
  system:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    use_distributed_optimizer: false
    overlap_grad_reduce: false      # 单进程/单卡：不需要 overlap（且它要求 distributed optimizer）
    overlap_param_gather: false
    checkpoint:
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage2_tiny_debug
      # 极小链上一环：stage1_pretrain 的 debug 档产物（它是 --no-save-optim/--no-save-rng 存的）
      load: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/pt_tiny_debug
      no_load_optim: true
      no_load_rng: true
      ckpt_format: torch_dist   # 与生产档同格式；SFT 极小档要能直接接这个 ckpt
      no_save_optim: true
      no_save_rng: true
    logging:
      log_interval: 1
  # 家族几何（num_layers / hidden / 头数 / head_dim / 压缩率 / indexer / mHC / AttnRes …）
  # 由 `common.build_config` 在 profile == "debug" 时从 tiny_model.TINY 注入——这里不再重复写，
  # 免得和 RL 用的 HF 产物（tiny_artifacts.py，也按 TINY 造）对不上。下面只留本档自己的东西。
  model:
    mtp_use_repeated_layer: true
    seq_length: 128
    max_position_embeddings: 128
    init_method_std: 0.02
    csa_dense_mode: false
    shensi_hf_config: ""          # 极小档不与全量 config.json 对拍
    micro_batch_size: 1
    global_batch_size: 2
    train_iters: 10        # 跨阶段连着算迭代号：stage1 到 5，这段接着跑到 10（只跑 5 步）
    eval_iters: 0
    optimizer:
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 1.0e-4
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.0
        lr_decay_style: constant
  data:
    no_create_attention_mask_in_dataloader: true
    mock_data: false
    # 极小语料：valid/test 太小会让 mcore 的 sampler 断言 no sample to consume → 只切 train
    split: 100,0,0
    tokenizer:
      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: ${oc.env:SHENSI_TOKENIZER,${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/models/tiny-tok}
      vocab_size: 129280
      make_vocab_size_divisible_by: 128

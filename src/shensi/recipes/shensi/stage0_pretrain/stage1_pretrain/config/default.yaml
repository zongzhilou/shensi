# stage1_pretrain：主预训练（稠密主干，从零开始）。
# 除数据与模型几何外，结构与超参照 GLM-5 报告：pre-training（27T 语料 = 2950 token/总参数）+ 本仓库 examples/glm5
# 的优化器/并行口径；token/参数的文献口径见 stage1_pretrain README 的「8 卡容量与吞吐账」。
defaults:
  - _self_

experiment:
  exp_name: shensi_stage1_pretrain
  seed: 42
  save_steps: 2000
  load: null
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage1_pretrain
  ckpt_format: torch_dist
  # 几何对拍的 HF 参考配置（`--shensi-hf-config` 指到它；见 train/args.py）
  shensi_hf_dir: ${oc.env:SHENSI_ROOT,/root/work/shensi}/src/shensi/recipes/shensi/common/config/hf
  tokenizer_dir: ${oc.env:SHENSI_TOKENIZER,/root/work/filestorage/models/DeepSeek-V4-Flash-0731}
  runner:
    nnodes: 1
    nproc_per_node: 8
  envs:
    LOGLEVEL: "INFO"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    OMP_NUM_THREADS: 4
    TOKENIZERS_PARALLELISM: "false"
    # 8 卡 bring-up 时的反复 OOM 是**碎片**、不是容量：最小配置（seq 64 × global_batch_size 8，
    # gbs ≥ DP = 8）打开可扩展段后 20/20 步跑通。峰值余量 ~12.3 GiB（订正：mcore 的 “(MB)” 是 10⁶ 字节，torch 的 GiB 是 1024³，1 GiB = 1073.74 MB；此前按 1024 混算成 8.8）——它决定 seq 能升到
    # 哪一档，是「天花板低」，不是「会炸」。
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

train:
  system:
    # 摊平时 bool `False` 会被丢掉（FlagScale 时代留下的语义）：要「关掉」写 `no_xxx: true`
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    # 新默认几何（2.78B/1.24B 激活）在 8 卡上的最优布局 = EP=1×DP=8：专家全份（1.57B×2 B = 3.1 GB/卡）
    # 免掉每层两次 all-to-all（19 层 × 2 次/步），显存账见 README（静态 12–14 GiB）。要跑 9B 档时改回 8。
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    use_distributed_optimizer: true
    # Muon 家族（AdaMuon）在 mcore 里会被转成 LayerWise；默认的 shard-aligned param layout 会把标量腿
    # 交给一个独立的 DistributedOptimizer，而那条路在保存**优化器状态**时会撞上游断言
    # （sharded_param_state_dp_reshardable，muon+lion 同样撞）。关掉 layout 让两条腿都进 LayerWise：
    # 状态仍然分片，存 / 续都验过（见 README 的「验证」）。
    no_use_layer_wise_param_layout: true
    overlap_grad_reduce: true
    overlap_param_gather: true
    precision:
      bf16: true
      attention_softmax_in_fp32: true
      accumulate_allreduce_grads_in_fp32: true
    logging:
      log_interval: 1
      tensorboard_log_interval: 10
      log_throughput: true
      log_params_norm: true
    checkpoint:
      save_interval: ${experiment.save_steps}
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage1_pretrain
      load: ${experiment.load}
      ckpt_format: ${experiment.ckpt_format}
      # 8 卡生产档走 precision-aware 优化器（跑档时显式 `--use-precision-aware-optimizer`，省显存的
      # 唯一路线），但它的优化器状态布局与 mcore dist-ckpt 不兼容——状态**存不了**；另一条
      # （非 precision-aware = fp32 梯度与动量）要多 15 GB 以上，8 卡装不下，而 `optimizer_cpu_offload`
      # 被上游断言强制要求 precision-aware（arguments.py："must be used in conjunction with …"）。
      # 两条路互堵，故接受**纯权重检查点**：权重完整、动量不存，续跑不是位级无缝。
      # 加载这种 ckpt 时给上游开关 `--no-load-optim`（RNG 照存，不需要 `--no-load-rng`）；
      # 入口会在保存时给 ckpt 旁落 `pure_weight.json`（保存侧钩子见 common/train/probes.py），
      # 续跑时按它点名这条口径。单卡 16G 口径（LayerWise + 无 layout，非 precision-aware）仍存全状态，
      # 见 README 的「验证」。
      no_save_optim: true

  model:
    transformer_impl: transformer_engine
    # --- 主干几何 = ShensiConfig 默认 + 19 层 + 1 MTP（compress_ratios 20 项，见 2p8b_a1p2b.json）---
    num_layers: 19
    mtp_num_layers: 1
    mtp_use_repeated_layer: true      # GLM-5 的 MTP 参数共享：1 层（重复层本身只有一份参数）
    hidden_size: 1280
    num_attention_heads: 16
    seq_length: 4096
    max_position_embeddings: 1048576
    norm_epsilon: 1.0e-6
    normalization: RMSNorm
    qk_layernorm: true
    # 0.02 是 GPT-2 以来的主流固定值（也是 Megatron/mcore 默认）；DeepSeek-V3 用 0.006，但他家的
    # 残差/输出投影另有缩放口径，跨架构搬数会破坏与 HF 的逐位对拍 → 保持 0.02。
    init_method_std: 0.02
    attention_dropout: 0.0
    hidden_dropout: 0.0
    position_embedding_type: rope
    rotary_base: 10000
    rotary_scaling_factor: 16           # compressor 层 YaRN（factor 16 / 原位置 65536）
    original_max_position_embeddings: 65536
    mscale: 1.0
    swiglu: true
    untie_embeddings_and_output_weights: true
    multi_latent_attention: true
    no_rope_fusion: false
    disable_bias_linear: true
    no_gradient_accumulation_fusion: true
    # --- 阶段口径：主预训练是稠密主干，DSA 在 stage2 引入 ---
    csa_dense_mode: true
    shensi_indexer_loss_coeff: 0.0
    # --- Shensi 家族旋钮（层计划 = 19 主干 + 1 MTP，见 json 的 compress_ratios：
    #     前两个 0（滑窗）→ 4/128 交替 ×8 对 → 第 19 层 4（CSA）→ MTP 层 0）---
    shensi_compress_ratios: 0,0,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,0
    shensi_mlp_layer_types: hash_moe,hash_moe,hash_moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe
    shensi_hc_mult: 16
    shensi_hc_active_streams: 4
    shensi_hc_fixed_streams: 2
    shensi_hc_conv_kernels: [4, 8, 12]
    shensi_head_dim: 512
    shensi_q_lora_rank: 320
    shensi_o_groups: 2
    shensi_o_lora_rank: 320
    shensi_partial_rotary_factor: 0.125
    shensi_moe_intermediate_size: 800
    shensi_routed_expert_hidden_size: 320
    shensi_sliding_window: 128
    shensi_index_topk: 512
    shensi_index_n_heads: 64
    shensi_index_head_dim: 128
    shensi_num_experts: 256
    shensi_num_experts_per_tok: 6
    shensi_attn_res_block_size: 2
    # 读路径加速（训练侧，只改执行方式；实测：compile 1.89x，算术逐位一致、仅采样序列不同；
    # TF32 与 compile 叠加 2.59x 但属精度改动，需先做短 A/B）。极小档在 debug.yaml 里关掉。
    shensi_attn_res_fast_path: compile
    shensi_attn_res_matmul_precision: highest
    shensi_hf_config: ${experiment.shensi_hf_dir}/2p8b_a1p2b.json
    # --- 三个 loss（stage1 只有 aux + MTP + ERC：稠密主干没有 indexer）---
    # 负载均衡走 DeepSeek 系的 `seq_aux_loss`（逐样本）；系数 0.001 = DeepSeek-V2-Lite 的取值（与我们同量级），
    # Qwen 的 LBL 单因子扫描（arXiv:2501.11873 Table 4：0.001/0.004/0.008）也是 0.001 最好。
    # V3/V4/GLM-4.5 之后改「0.0001 序列损失 + 路由偏置修正 γ=0.001」——偏置（noaux_tc）会改前向路由、
    # 而 HF 参考里没有它（Bridge 侧 moe_router_enable_expert_bias=False 是刻意的对拍约束），故不走那条。
    # hash 层由 mcore 自动豁免（router.py：aux_loss_enabled = not is_hash_layer）。
    moe_router_load_balancing_type: seq_aux_loss
    moe_aux_loss_coeff: 0.001
    # MTP 损失权重 λ：DeepSeek-V3/V4 与 GLM-4.5 口径一致——前期 0.3、进入 LR 衰减段降到 0.1。
    # mcore 只有单值（默认 0.1）；本配方取 0.3，最后 ~15% 要按文献降档就续跑时
    # `--set train.model.shensi_mtp_loss_scaling_factor=0.1`。
    shensi_mtp_loss_scaling_factor: 0.3
    shensi_erc_loss_coef: 1.0
    shensi_erc_loss_alpha: 0.5
    # --- 训练（batch / LR / 优化器的逐条文献账见同目录 HYPERPARAMS.md）---
    # 每步 1.05M token（mbs 8 × DP 8 × 累积 4 = gbs 256 × seq 4096）：文献里 1–3B 模型的步批都在
    # 1.05–4.2M token（Cerebras-2.7B = 1.08M @ LR 2e-4，是与我们规模/预算最接近的锚），MoE 锚普遍 ≥16M。
    # 57B passes → 5.4 万步。
    seed: ${experiment.seed}
    finetune: false
    micro_batch_size: 8
    global_batch_size: 256
    # 评估/早停口径：iters 给“接近无穷”，靠 eval + 看门狗决定何时停（recipes/shensi/early_stop.py）；
    # 「收敛可测」的数值闸门 = common/train/loss_gate.py（按 Chinchilla 律 + MoE 折扣 + 重复修正算预期曲线，
    # 30% 处偏差 >0.3 nats 判异常）；验收 bar 见 HYPERPARAMS.md 末节。
    eval_iters: 20
    eval_interval: 500
    train_iters: 1000000        # 由 train.py --tokens 自动换算：tokens / (global_batch_size * seq_length)
    optimizer:
      # --- 优化器：AdaMuon（矩阵腿）+ GrokFastAdamW（标量腿），两条腿共用一条 LR 曲线 ---
      optimizer: adaptive_muon
      # 标量腿（embedding / 输出头 / norm / router / mHC 静态 / AttnRes 门控 / 哈希嵌入 / 压缩器位置表）
      # 走 GrokFastAdamW（arXiv:2405.20233，梯度低通滤波 + AdamW；`grokfast_alpha` / `grokfast_lamb`
      # 是三条滤波旋钮里的两条，after_step 用库默认）。数学与状态都在 pytorch_optimizer，接入层在
      # shensi/utils/optimizer.py；换 AdEMAMix 对照档就把这里改回 ademamix（见 config/ademamix.yaml）。
      muon_scalar_optimizer: grokfastadamw
      # 矩阵腿的 Newton–Schulz 口径：Muon Split（q/kv 分开，再叠加 MLA 的按头/按组切分）是默认行为，
      # 关掉用 --muon-no-split-qkv
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express # 最新一代 Newton–Schulz 系数（比 quintic 更稳的低步数解）
      muon_scale_mode: spectral            # 每参数谱尺度（AdaMuon 的第二矩按它归一）
      muon_momentum: 0.95
      muon_nesterov: true                  # Nesterov 动量
      muon_tp_mode: distributed            # 零冗余分布式 Newton–Schulz
      # 更新幅度对齐 AdamW：DeepSeek-V4-Flash 自己的 0.18 / Moonlight(Muon) 与 GLM-4.5 的 0.2 /
      # 解析匹配 sqrt((1-β1)/(1+β1)) = 0.229，三者在 0.18–0.23 带内 → 取本架构同源的 0.18。
      muon_extra_scale_factor: 0.18        # 把 AdaMuon 的更新幅度归一到 Adam 系量级 → 两条腿共用一条 LR
      clip_grad: 1.0                       # 文献众数（Llama-1/2、Pythia、Cerebras、DeepSeek-V3、OLMoE 都是 1.0）
      weight_decay: 0.1                    # 文献众数；对 Muon 是必需品（Moonlight Fig.2：无 wd 权重会涨出 bf16 范围）
      adam_beta1: 0.9
      # β2 从 0.999 改 0.95：Llama-1/2、TinyLlama、Pythia、Cerebras、DeepSeek-V3、OLMoE、SmolLM2 全用 0.95；
      # DeepSeek-V4 给 embedding/输出头/norm 的 AdamW 组也是 (0.9, 0.95)（ε=1e-20；我们保持库默认 1e-8）。
      adam_beta2: 0.95
      # GrokFast（arXiv:2405.20233）：论文推荐 λ∈[0.5,5]、α∈[0.8,0.99]，0.98/2.0 是算法/IMDb 任务最优点，
      # 落在推荐带内但 LLM 尺度没有公开对照 → 属「未锚定项」，靠本仓 A/B（见 HYPERPARAMS.md）。
      # 库的 normalize_lr 默认 True 会把标量腿 LR 除以 (1+λ)=3 以补偿滤波放大（ĝ=g+λµ）——设计如此，不是 bug。
      grokfast_alpha: 0.98
      grokfast_lamb: 2.0
      lr_scheduler:
        # 峰值 2.7e-4 = DeepSeek-V4-Flash 自己的值（本架构同源）；同规模/预算的公开锚：Cerebras-2.7B 2e-4、
        # Pythia-1.4B 2e-4、phi-1.5 2e-4、DeepSeek-V3 2.2e-4、GLM-4.5 2.5e-4、OLMoE 4e-4（后者是 5T token 档）。
        # 短跑取带内偏上；这一条仍是最需要上机标定的：`pilot_lr.py` 三点扫描后定档。
        lr: 2.7e-4
        min_lr: 2.7e-5                     # 10% 下限是文献众数（Llama-2/Pythia/Cerebras/V3/OLMoE/Moonlight）
        lr_warmup_fraction: 0.03           # ≈1.6k 步；文献绝对 warmup 众数 2000 步（Llama-2/TinyLlama/V3/Moonlight）
        lr_decay_style: cosine             # cosine→10% 支撑最广；GLM-4.5 明确试过 WSD 反而欠训（general bench 更差）

  data:
    no_create_attention_mask_in_dataloader: true
    reset_position_ids: false
    reset_attention_mask: false
    data_path: []               # 由 data_prep.py 产出的 blend.json 注入（权重×前缀，交错）
    split: 98,1,1
    tokenizer:
      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: ${experiment.tokenizer_dir}
      vocab_size: 129280
      make_vocab_size_divisible_by: 128

# stage1_pretrain：主预训练（稠密主干，从零开始）。
# 除数据与模型几何外，结构与超参照 GLM-5 报告：pre-training（27T 语料）+ 本仓库 examples/glm5 的优化器/并行口径。
defaults:
  - _self_

experiment:
  exp_name: shensi_stage1_pretrain
  seed: 42
  save_steps: 2000
  load: null
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage1_pretrain
  ckpt_format: torch_dist
  shensi_conf_dir: ${oc.env:SHENSI_ROOT,/root/work/shensi}/3rdparty/common/FlagScale/examples/shensi/conf
  tokenizer_dir: ${oc.env:SHENSI_TOKENIZER,/root/work/filestorage/models/DeepSeek-V4-Flash-0731}
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_shensi.py
  runner:
    per_node_task: false
    rdzv_backend: static
    hostfile: null
    nnodes: 1
    nproc_per_node: 8
  cmds:
    before_start: export PATH=${oc.env:SHENSI_ROOT,/root/work/shensi}/entrypoints/bin:$PATH
  envs:
    LOGLEVEL: "INFO"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    OMP_NUM_THREADS: 4
    TOKENIZERS_PARALLELISM: "false"

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra

train:
  system:
    # 注意：no_shared_fs 是 FlagScale runner 级的开关（写在 experiment.runner 里），
    # 放到 train.system 会被摊成 --no_shared_fs 传给 torchrun 而报错。
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 8
    context_parallel_size: 1
    sequence_parallel: false
    use_distributed_optimizer: true
    overlap_grad_reduce: true
    overlap_param_gather: true
    precision:
      bf16: true
      attention_softmax_in_fp32: true
      accumulate_allreduce_grads_in_fp32: true
    logging:
      log_interval: 1
      tensorboard_log_interval: 10
      log_throughput: true
      log_params_norm: true
    checkpoint:
      save_interval: ${experiment.save_steps}
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage1_pretrain
      load: ${experiment.load}
      ckpt_format: ${experiment.ckpt_format}

  model:
    transformer_impl: transformer_engine
    # --- 主干几何 = ShensiConfig 默认 + 36/38 项 compress_ratios（见 9b_a4b.json）---
    num_layers: 35
    mtp_num_layers: 3
    mtp_use_repeated_layer: true      # GLM-5 的 MTP 参数共享：3 层共享一份参数
    hidden_size: 2560
    num_attention_heads: 32
    seq_length: 4096
    max_position_embeddings: 1048576
    norm_epsilon: 1.0e-6
    normalization: RMSNorm
    qk_layernorm: true
    init_method_std: 0.02
    attention_dropout: 0.0
    hidden_dropout: 0.0
    position_embedding_type: rope
    rotary_base: 10000
    rotary_scaling_factor: 16           # compressor 层 YaRN（factor 16 / 原位置 65536）
    original_max_position_embeddings: 65536
    mscale: 1.0
    swiglu: true
    untie_embeddings_and_output_weights: true
    multi_latent_attention: true
    no_rope_fusion: true
    disable_bias_linear: true
    no_gradient_accumulation_fusion: true
    # --- 阶段口径：主预训练是稠密主干，DSA 在 stage2 引入 ---
    csa_dense_mode: true
    shensi_indexer_loss_coeff: 0.0
    # --- Shensi 家族旋钮（层计划 = 35 主干 + 3 MTP，见 json 的 compress_ratios）---
    shensi_compress_ratios: 0,0,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,0,0,0,0,0
    shensi_mlp_layer_types: hash_moe,hash_moe,hash_moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe
    shensi_hc_mult: 16
    shensi_hc_active_streams: 4
    shensi_hc_fixed_streams: 2
    shensi_hc_conv_kernels: [4, 8, 12]
    shensi_head_dim: 512
    shensi_q_lora_rank: 640
    shensi_o_groups: 4
    shensi_o_lora_rank: 640
    shensi_partial_rotary_factor: 0.125
    shensi_moe_intermediate_size: 1280
    shensi_routed_expert_hidden_size: 640
    shensi_sliding_window: 128
    shensi_index_topk: 512
    shensi_index_n_heads: 64
    shensi_index_head_dim: 128
    shensi_num_experts: 256
    shensi_num_experts_per_tok: 6
    shensi_attn_res_block_size: 4
    shensi_hf_config: ${experiment.shensi_conf_dir}/9b_a4b.json
    # --- 三个 loss（stage1 只有 aux + ERC：稠密主干没有 indexer）---
    moe_aux_loss_coeff: 0.001
    shensi_erc_loss_coef: 1.0
    shensi_erc_loss_alpha: 0.5
    # --- 训练（LR 走 DeepSeek-V4-Flash 的 2.7e-4 峰值；AdamW 的旧口径见 config/adamw.yaml）---
    seed: ${experiment.seed}
    finetune: false
    micro_batch_size: 1
    global_batch_size: 128
    # 评估/早停口径：iters 给“接近无穷”，靠 eval + 看门狗决定何时停（recipes/shensi/early_stop.py）
    eval_iters: 20
    eval_interval: 500
    train_iters: 1000000        # 由 train.py --tokens 自动换算：tokens / (global_batch_size * seq_length)
    optimizer:
      # --- 优化器：Muon（矩阵）+ AdEMAMix（非矩阵）混合，对齐 DeepSeek-V4 / GLM-5 / Kimi K2 的最新口径 ---
      optimizer: muon
      # Muon Split（GLM-5；本家族再叠加 MLA 的按头/按组切分）是默认行为，关掉用 --muon-no-split-qkv
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express # 最新一代 Newton–Schulz 系数（比 quintic 更稳的低步数解）
      muon_scale_mode: spectral            # Moonlight / V4 的每参数尺度
      muon_momentum: 0.95
      muon_nesterov: true                  # V4 用 Nesterov 动量
      muon_tp_mode: distributed            # GLM-5 的零冗余分布式 Muon
      muon_extra_scale_factor: 0.18        # V4 的 γ：把 Muon 更新幅度归一到 AdamW 量级 → 两条腿共用一条 LR
      muon_scalar_optimizer: ademamix      # 非矩阵（embedding / 输出头 / norm / router / mHC 静态）走 AdEMAMix
      ademamix_alpha: 5.0
      ademamix_beta3: 0.9999
      clip_grad: 1.0
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.999
      lr_scheduler:
        lr: 2.7e-4
        min_lr: 2.7e-5
        lr_warmup_fraction: 0.03
        lr_decay_style: cosine

  data:
    reset_position_ids: false
    reset_attention_mask: false
    data_path: []               # 由 data_prep.py 产出的 blend.json 注入（权重×前缀，交错）
    split: 98,1,1
    tokenizer:
      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: ${experiment.tokenizer_dir}
      vocab_size: 129280
      make_vocab_size_divisible_by: 128

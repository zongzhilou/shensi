# AdamW 档：老的默认口径（GLM-5 报告 1b 配置：0.9/0.999、wd 0.1、lr 1e-5→1e-6、warmup 3%、cosine）。
# 留着做对照：默认档的 Muon + AdEMAMix 混合相对它应当更快收敛、loss spike 更少
# （Qwen3.8 报的数：2× LR 下每 10k 步 spike 4.3 → 0.2）。
train:
  model:
    optimizer:
      optimizer: adam
      clip_grad: 1.0
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.999
      lr_scheduler:
        lr: 1.0e-5
        min_lr: 1.0e-6
        lr_warmup_fraction: 0.03
        lr_decay_style: cosine

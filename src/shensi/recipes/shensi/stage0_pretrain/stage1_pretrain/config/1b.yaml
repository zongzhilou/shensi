# 8 卡「发布跑」几何 + 训练口径（1b_a1b：总参 ~1.14B / 激活 ~1.00B，几何单一来源见
# common/config/hf/1b_a1b.json）。用途：在 8 卡上把训练**完整跑完**（LR 余弦走完、检查点可续），
# 产出像发布模型一样可以 eval 的权重；质量参照 Pythia-1B 那一类研究发布（300B token 级、t/p ~300）——
# 现代大厂小模型的过训带（1–36T token）不在这台机的算力里。决策与时长表见 README 的「8 卡发布跑」。
#
# 跑法（token 预算驱动 train_iters；warmup 与 cosine 横轴跟着缩）：
#   python train.py --profile 1b --tokens 150e9      # 150B ≈ 13–23 天 @15–25% MFU
# 并行：8 = DP 8 ×（TP 1 × PP 1 × EP 1）——MoE 不切专家，省掉每层 all-to-all（EP 路径由 9B / scale8 档覆盖）。
# 峰值 LR 待 3 点 pilot（1e-4 / 3e-4 / 6e-4，各 ~2k 步）定档：小模型 + 同样 token/步，别照抄 9B 的 2.7e-4。
base: default.yaml

experiment:
  exp_name: shensi_pt_1b
  geometry: 1b_a1b
  save_steps: 2000

train:
  system:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    use_distributed_optimizer: true
  model:
    seq_length: 4096
    micro_batch_size: 8          # 8 × 4096 = 32k token/微批
    global_batch_size: 128       # 524k token/步 = 8 × 8 × 累积 2（与 9B 计划同 token/步）
    optimizer:
      lr_scheduler:
        lr: 3.0e-4               # 提案值，等 pilot 定档
        min_lr: 3.0e-5

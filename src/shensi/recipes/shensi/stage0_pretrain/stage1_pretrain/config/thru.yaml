# 极限吞吐档（9B 配置不动，只改训练侧）：把"每步 512 token × 8 次累积"的病灶改掉。
#
# 病灶（实测 14.9 s/步 = 34 token/s ≈ 0.03% MFU）：微批只有 64 token（seq64 × mbs1），每个算子都在
# latency/带宽区，8 次累积再把这个开销乘 8。本档按设计批量来：seq 4096 × 微批 8 = 32k token/微批，
# 累积 16 → 524k token/步（= 计划的 token/步）。
# 目标位：8 卡 15–25% MFU ≈ 1.8–3 万 token/s（TinyLlama 在 8×A100 级硬件上做到 56% MFU/卡）——
# 即 10B token 4–7 天、30B 11–20 天、183B（Chinchilla 最优）2–3 个月。逐条杠杆与判定协议见 README 的
# 「吞吐能优化到极限吗」一节。
#
# 上机顺序：先 --profile scale8 起 1 步（验 TP=2 能跑通）→ 本档跑 ~20 步量 token/s →
# 同 token/步下再跑 accum 1 / 4 两档（定"每微批开销 vs 每步固定开销"）→ 逐条加杠杆。
base: default.yaml

experiment:
  exp_name: shensi_pt_thru
  save_steps: 2000

train:
  system:
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 4
    # TP>1 下激活按序列切：省显存（换更大的微批）且是 tp_comm_overlap 的前提。
    # 若起训报错/数值异常，先关掉这条（false 会被摊平丢掉 = 关）再排查。
    sequence_parallel: true
  model:
    seq_length: 4096
    micro_batch_size: 8         # 32k token/微批 = 现在的 500 倍；不重算时激活 ~5.7 GiB，头寸内
    global_batch_size: 128      # = 微批 8 × DP 1 × 累积 16 → 524k token/步
    optimizer:
      lr_scheduler:
        lr: 1.0e-4              # 与 scale8 同：等 3 点 pilot（5e-5 / 1e-4 / 2e-4）定档
        min_lr: 1.0e-5

# —— 逐条试的吞吐杠杆（先在注释里；每开一条只量 step 时间，报错/变慢就回退）——
# ① 重算换更大的微批（激活 5.7 → 2.8 GiB @mbs 16 / 1.4 GiB @mbs 32）：
#    train.system.recompute_granularity: full
#    train.system.recompute_method: uniform
#    train.system.recompute_num_layers: 8
#    （shensi 的层是否支持 full 重算需真机确认；不支持就退回 `selective` + `recompute_modules: moe mlp`）
# ② MoE grouped GEMM：专家 FFN 从逐专家小 GEMM 换成分组大 GEMM（NPU 侧由 MindSpeed-Ops 承接）：
#    train.model.moe_grouped_gemm: true
# ③ TP 通信与 GEMM 重叠（需要 sequence_parallel: true）：
#    train.system.tp_comm_overlap: true
# ④ MoE 专家并行 all-to-all 与计算重叠（mcore 新版才有这个名字；你的 mcore 没有就跳过）：
#    train.system.overlap_moe_expert_parallel_comm: true
# ⑤ TE 融合（9B 档默认关着；TE-NPU 在装的前提下逐条开；false 会被摊平丢掉 = 不传 flag = 打开）：
#    train.model.no_gradient_accumulation_fusion: false
#    train.model.no_persist_layer_norm: false
# ⑥ HCCL 缓冲与算法（env 直接给；420 MB 的 HCCL 缓冲曾出现在 OOM 栈里）：
#    experiment.envs.HCCL_BUFFSIZE: "…"

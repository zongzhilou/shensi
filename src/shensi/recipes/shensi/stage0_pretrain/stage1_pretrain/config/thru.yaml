# 极限吞吐档（默认几何 2.29B / 0.76B 激活，只改训练侧）：把"每步 512 token × 8 次累积"的病灶改掉。
#
# 病灶（9B 档实测 14.9 s/步 = 34 token/s ≈ 0.03% MFU）：微批只有 64 token（seq64 × mbs1），每个算子都在
# latency/带宽区，8 次累积再把这个开销乘 8。default.yaml 已经按设计批量走（mbs 8 / 1.05M token/步），
# 本档只把**微批再抬一档**（mbs 16 = 64k token/微批）看发射摊销的上限在哪里。
# 目标位：8 卡 15–25% MFU ≈ 9.9–16.5 万 token/s（100% 上限 = 66.1 万；TinyLlama 在 8×A100 级硬件上做到
# 56% MFU/卡）——即 10B token 0.7–1.2 天、57B passes（1.24 × Chinchilla@2.29B）4.0–6.7 天、一周 ≈ 59.9–99.8B token。
# 逐条杠杆与判定协议见 README 的「吞吐能优化到极限吗」一节。
#
# 上机顺序：先 --profile scale8 起 1 步（验布局与静态）→ 本档跑 ~20 步量 token/s →
# 同 token/步下再跑累积 1 / 4 两档（定"每微批开销 vs 每步固定开销"）→ 逐条加杠杆。
base: default.yaml

experiment:
  exp_name: shensi_pt_thru
  save_steps: 2000

train:
  model:
    seq_length: 4096
    micro_batch_size: 16        # 64k token/微批 = 9B 档实测微批的 1000 倍
    global_batch_size: 256      # = 微批 16 × DP 8 × 累积 2 → 1.05M token/步（与 default 同 token/步）
    # fp32-keep（默认开）只保 HF `_keep_in_fp32_modules_strict` 名单（norm / sinks / 位置表，~0.1M 权重）
    # 的 fp32 master；AttnRes 读模块的 fp32 计算在模块内部（逐调用 cast，对齐 HF 朴素实现），与这个开关无关。
    # 标定/正式跑打开下面这行（名单也走 bf16，mHC 移除后这条杠杆只剩记账意义）：
    # 代价是数值与 fp32 参考有小差（训练本来就是 bf16 混合精度），
    # 要逐位对拍（HF↔mcore 的 parity 闸门）时再把这行注释掉。
    no_shensi_fp32_keep: true

# —— 布局级备选：EP=8（专家切 8 卡，省每卡 ~2.7 GB 静态，代价是每层两次 all-to-all）——
#   default/本档都是 EP=1（专家全份，3.1 GB/卡）；标定台里 `--points ep8` 那一点就是这条对照。
#   唯一会用到 EP>1 的场景是跑 9B 几何（静态压不下来）。

# —— 逐条试的吞吐杠杆（先在注释里；每开一条只量 step 时间，报错/变慢就回退）——
# ① 重算换更大的微批（激活 ~5.6 → 2.8 GiB @mbs 32）：
#    train.system.recompute_granularity: full
#    train.system.recompute_method: uniform
#    train.system.recompute_num_layers: 8
#    （shensi 的层是否支持 full 重算需真机确认；不支持就退回 `selective` + `recompute_modules: moe mlp`）
# ② MoE grouped GEMM：专家 FFN 从逐专家小 GEMM 换成分组大 GEMM（NPU 侧由 MindSpeed-Ops 承接）：
#    train.model.moe_grouped_gemm: true
# ③ TP 通信与 GEMM 重叠（需要 TP>1 + sequence_parallel: true；本档 TP=1 用不上）
# ④ MoE 专家并行 all-to-all 与计算重叠（EP>1 布局才用得上；mcore 新版才有这个名字）
# ⑤ TE 融合（默认关着；TE-NPU 在装的前提下逐条开；false 会被摊平丢掉 = 不传 flag = 打开）：
#    train.model.no_gradient_accumulation_fusion: false
#    train.model.no_persist_layer_norm: false
# ⑥ HCCL 缓冲与算法（env 直接给；420 MB 的 HCCL 缓冲曾出现在 OOM 栈里）：
#    experiment.envs.HCCL_BUFFSIZE: "…"

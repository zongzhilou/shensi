# 正式跑的语料口径（8 卡版）：唯一语料 100B token，跑 1–2 个 epoch（= 100–200B token-passes）。
#
# 为什么不是智谱那个 2.9T：2.9T 是"按激活 675 t/p"的集群账（8 卡要 4 年）。8 卡的物理上限是
# 优化吞吐后的 1.8–3 万 token/s → 每月 47–78B token-passes，所以 8 卡的正式预算 = 100–200B passes
# （唯一 100B × 1–2 epoch，2 epoch 的第二遍按数据受限缩放律只值第一遍的 ~40–50%）。
# 对应的 t/p：总参 11–22（Chinchilla 20 一线）、激活 24–47（智谱 675 的 1/14–1/28）——8 卡买不到
# 智谱的过训量，质量只能靠"精选 + 合成 + 蒸馏 + 重复"把每个 token 用到最满（phi 路线的教训）。
#
# 用法：python data_prep.py --config config/data_prep/formal.yaml --prepare
#   → 产出 <out>/{<源>__.jsonl, *_text_document.bin/.idx, blend.json, budget_report.json}
#   → 训练：python train.py --tokens 1e11（1 epoch）/ --tokens 2e11（2 epoch，推荐上限）
# 合成与蒸馏的份额建议：唯一 100B 里掺 20–30B 教材式合成（NeMo DataDesigner）与 teacher 蒸馏
# （stage3_opd 链路）——这部分按 blend 条目的 weight 给，管线不区分来源类型。
blend: data_blend_raw.json
tokens: 1e11          # 唯一语料预算（各源按 weight 分；上限受各源可用量与筛选率限制）
quality: heuristic    # 入库前轻筛（Gopher 类子集）；重筛在上游（NeMo Curator）
dedup: near           # 精确 + MinHash 近邻；TB 级重筛同样交给上游

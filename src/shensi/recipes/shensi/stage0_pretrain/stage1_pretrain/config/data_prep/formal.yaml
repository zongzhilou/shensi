# 正式跑的语料口径：预算化打包（跑完直接 train）。
#
# token 预算按智谱实测口径：GLM-5 是 27T/40B 激活（675 t/p 激活）、GLM-4.5 是 23T/32B（719 t/p 激活），
# 他们明确"按激活参数"算数据与推理能力。本模型 9.15B/4.235B 激活 → 按激活 ≈ 2.9T token。
# 另一条锚（按总参）：GLM-5 36 t/p → 0.33T；GLM-4.5 65 t/p → 0.6T；Llama-3-8B 1875 → 17T；
# Qwen3-8B 4500 → 41T。首跑建议 2.9T；算力不够就按同比例降（0.6T 是"按总参"的下沿）。
#
# 用法：python data_prep.py --config config/data_prep/formal.yaml --prepare
# 产物：<out>/{<源>__*.jsonl, *_text_document.bin/.idx, blend.json, budget_report.json}；
# train.py 会自动把 blend.json 的权重×前缀注入 data_path，无需再改配置。
blend: data_blend_raw.json
tokens: 2.9e12        # 预算：各源按 weight 分（min(2H, M·num_blocks) 那一套跟这里无关，纯语料预算）
quality: heuristic    # 入库前轻筛（Gopher 类子集）；重筛在上游（NeMo Curator）做
dedup: near           # 精确 + MinHash 近邻；TB 级重筛同样交给上游

# AdEMAMix-only 对照档：整个模型都用 AdEMAMix（arXiv:2409.03137），矩阵参数也不走 AdaMuon。
#
# 默认档是"AdaMuon（矩阵腿）+ AdEMAMix（标量腿）"；这档把矩阵腿也换成 AdEMAMix，
# 用来对照"两条腿都换掉"的收敛曲线。主体名 `ademamix` 由 shensi/utils/optimizer.py 注册进
# emerging_optimizers 的名字表（mcore 的 emerging 路径直接取）。
#
# 跑法：python train.py --profile ademamix
base: default.yaml

train:
  model:
    optimizer:
      optimizer: ademamix
      # 名字与 pytorch_optimizer.AdEMAMix 的构造参数一致：mcore 按 `ademamix_{参数}` 从 config 取
      ademamix_betas: [0.9, 0.999, 0.9999]
      ademamix_alpha: 5.0
      ademamix_beta3: 0.9999
      clip_grad: 1.0
      weight_decay: 0.1
      lr_scheduler:
        lr: 2.7e-4
        min_lr: 2.7e-5
        lr_warmup_fraction: 0.03
        lr_decay_style: cosine

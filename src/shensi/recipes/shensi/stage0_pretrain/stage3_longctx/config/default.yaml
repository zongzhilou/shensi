# stage3_longctx：长上下文扩展（默认档 = 128K / 500B tokens，对应 GLM-5 mid-training 的 128K 段）。
# 稀疏注意力保持打开（继承 stage2），indexer KL 继续生效。
base: ../../stage2_midtrain/config

experiment:
  exp_name: shensi_stage3_longctx_128k
  load: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage2_midtrain
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage3_longctx
  save_steps: 200

train:
  system:
    context_parallel_size: 2      # 长序列按显存开 CP（128K 起建议 ≥2；CP 下 indexer topk 的正确性要实测）
    checkpoint:
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage3_128k
      load: ${experiment.load}
  model:
    # 早停看门狗盯验证损失（validation loss）
    eval_iters: 20
    eval_interval: 100
    seq_length: 131072
    train_iters: 1000             # 由 --tokens 500e9 自动换算
    optimizer:
      # --- 优化器：AdaMuon（矩阵腿）+ AdEMAMix（标量腿），续训不重启调度器 ---
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix     # 换 GrokFastAdamW 就写 grokfastadamw
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18        # 两条腿共用一条 LR 曲线的归一系数
      clip_grad: 1.0
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.999
      ademamix_betas: [0.9, 0.999, 0.9999]
      ademamix_alpha: 5.0
      lr_scheduler:
        lr: 1.0e-5                # 长上下文续训：沿用中训练收尾的量级
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.0
        lr_decay_style: constant
  data:
    no_create_attention_mask_in_dataloader: true
    data_path: []

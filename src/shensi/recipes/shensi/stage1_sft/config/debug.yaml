# SFT 极小档：mcore 的 --sft（数据是 messages jsonl，loss mask 由 SFTTokenizer 生成）。
base: ../../stage0_pretrain/stage1_pretrain/config

experiment:
  exp_name: shensi_stage1_sft_debug
  # 极小档的几何全部继承 stage1_pretrain 的 default，只覆盖下面这些
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage1_sft_debug
  runner:
    nnodes: 1
    nproc_per_node: 1
  load: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/pt_tiny_debug

train:
  system:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    use_distributed_optimizer: false
    overlap_grad_reduce: false
    overlap_param_gather: false
    checkpoint:
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage1_sft_debug
      load: ${experiment.load}
      no_load_optim: true   # PT 的极小 ckpt 是 --no-save-optim 存的，没有优化器状态
      no_load_rng: true     # 同理没有 rng 状态
  model:
    num_layers: 2
    mtp_num_layers: 0      # 与 PT 极小档一致：mHC 下 MTP 跑不通（见 stage0_pretrain 的 README「局限」）
    mtp_use_repeated_layer: true
    hidden_size: 128
    num_attention_heads: 4
    max_position_embeddings: 2048
    shensi_hf_config: ''
    csa_dense_mode: false
    shensi_indexer_loss_coeff: 0.01
    # 与 PT 极小档同几何（含 indexer，否则 ckpt 参数集对不上）：SFTDataset 一定打包，
    # 所以这段走 CSA 的 THD 逐段路径
    shensi_compress_ratios: 4,128
    shensi_mlp_layer_types: hash_moe,moe
    shensi_head_dim: 64
    shensi_q_lora_rank: 64
    shensi_o_lora_rank: 32
    shensi_moe_intermediate_size: 32
    shensi_routed_expert_hidden_size: 32
    shensi_sliding_window: 64
    shensi_index_topk: 32
    shensi_index_n_heads: 8
    shensi_index_head_dim: 16
    shensi_num_experts: 8
    shensi_num_experts_per_tok: 2
    shensi_attn_res_block_size: 4
    shensi_partial_rotary_factor: 0.125
    overlap_grad_reduce: false
    overlap_param_gather: false
    use_distributed_optimizer: false
    sft: true
    sft_tokenizer_prompt_format: identity
    # SFT 数据集要求 create_attention_mask=False（sft_dataset.py:176 的断言）
    no_create_attention_mask_in_dataloader: true
    seq_length: 2048          # SFT 样本比 PT 的长（实测 1462/2745 token），要放得下
    micro_batch_size: 1
    global_batch_size: 2
    train_iters: 2
    # finetune=true：只接模型权重，忽略 ckpt 里的 iteration/优化器/rng（SFT 从预训练 ckpt 起就该这样）
    finetune: true
    eval_iters: 0
  data:
    data_path: []            # 由 train.py 注入（sft_train.jsonl）
    split: 1
    tokenizer:
      tokenizer_type: SFTTokenizer
      # 上游只认四个模板名（nemotron-nano-v2 / nemotron-h-aligned / identity / default）；
      # 极小档用 identity：只把各条 content 串起来，不依赖 tokenizer 带 chat_template，也不做
      # 角色掩码——目的只是把 SFT 这条路（messages jsonl → SFTTokenizer → loss mask）跑通。
      sft_tokenizer_prompt_format: identity
      tokenizer_model: ${oc.env:SHENSI_TOKENIZER,${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/models/tiny-tok}
      vocab_size: 129280
      make_vocab_size_divisible_by: 128

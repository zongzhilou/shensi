# stage1_sft 的全量档：从预训练末段 ckpt 起，用 mcore 的 --sft 做指令微调。
# 数据 = data_prep.py 产出的 messages jsonl（loss mask 由 SFTTokenizer 按 chat 模板生成）。
base: ../../stage0_pretrain/stage1_pretrain/config

experiment:
  exp_name: shensi_stage1_sft
  load: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage3_1m
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage1_sft
  save_steps: 200

train:
  system:
    checkpoint:
      save: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/stage1_sft
      load: ${experiment.load}
  model:
    # --- SFT 口径 ---
    sft: true
    # 上游只认四个模板名：nemotron-nano-v2 / nemotron-h-aligned / identity / default。
    # 正式档用 default = 用 tokenizer 目录里自带的 chat_template（DeepSeek 官方 tokenizer 的
    # tokenizer_config.json 里有 DSv4 那份）；副本里没有 chat_template 就改用 nemotron-h-aligned
    # （需要 <SPECIAL_10/11>）或把模板补进 tokenizer_config.json。
    sft_tokenizer_prompt_format: default
    seq_length: 32768
    micro_batch_size: 1
    global_batch_size: 32
    train_iters: 5000
    # 评估/早停：iters 给大值，靠 eval + 看门狗收尾（recipes/shensi/early_stop.py）
    eval_iters: 20
    eval_interval: 100
    optimizer:
      # --- 优化器：AdaMuon（矩阵腿）+ AdEMAMix（标量腿），与预训练同一套（微调只换 LR 曲线） ---
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix     # 换 GrokFastAdamW 就写 grokfastadamw
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18        # 两条腿共用一条 LR 曲线的归一系数
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      ademamix_betas: [0.9, 0.95, 0.9999]  # 标量腿的 (beta_fast, beta2, beta_slow)
      ademamix_alpha: 5.0
      lr_scheduler:
        lr: 1.0e-5
        min_lr: 1.0e-6
        lr_warmup_fraction: 0.01
        lr_decay_style: cosine
  data:
    no_create_attention_mask_in_dataloader: true
    data_path: []            # 由 train.py 注入（sft_train.jsonl）
    split: 98,1,1   # 同一份 jsonl 切出验证集：早停看门狗盯 validation loss
    tokenizer:
      tokenizer_type: SFTTokenizer
      tokenizer_model: ${oc.env:SHENSI_TOKENIZER,/root/work/filestorage/models/DeepSeek-V4-Flash-0731}
      vocab_size: 129280
      make_vocab_size_divisible_by: 128

# 极小档：1 epoch、小批、少采样，只验"数据 → verl → rollout → 打分"这条链路。
base: ../../stage1_rlvr/config/debug.yaml
model:
  path: ${oc.env:SHENSI_FS,/root/work/filestorage}/models/DeepSeek-V4-Flash-0731
algorithm:
  adv_estimator: grpo
harness:                             # 与 stage3_eval 同一份接线（`shensi.recipes.shensi.harness`）：
  name: dsh                          # 环境/工具层都用 DeepSeek Harness（dsh），端点就是我们起的 vllm serve
  home: ${oc.env:DSH_HOME,${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/dsh-home}
  command: dsh                       # 直接跑（不经 Gym）时的命令
  install: deepseek-harness-sdk
  env:                               # Sim 档把环境换成语言世界模型的 HTTP 服务，dsh 按同一套 JSON 调它
    SHENSI_WORLD_MODEL_URL: ${oc.env:SHENSI_WORLD_MODEL_URL,http://127.0.0.1:9000/v1}
    SHENSI_WORLD_MODEL: ${oc.env:SHENSI_WORLD_MODEL,world-model}

rollout:
  n: 2
  temperature: 1.0
  max_model_len: 2048
  gpu_memory_utilization: 0.3
actor:
  optim:
    lr: 1.0e-5
  ppo_mini_batch_size: 2
  ppo_micro_batch_size_per_gpu: 1
data:
  max_prompt_length: 512
  max_response_length: 128
  train_batch_size: 2
  val_batch_size: 2
trainer:
  total_epochs: 1
  val_before_train: true
  test_freq: -1
  n_gpus_per_node: 1
  nnodes: 1
  logger: '["console"]'
  project_name: shensi_rl
  experiment_name: shensi_stage2_agentic_debug

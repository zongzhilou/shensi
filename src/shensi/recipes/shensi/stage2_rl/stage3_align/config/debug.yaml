# 极小档：1 epoch、小批、少采样，只验"数据 → verl → rollout → 打分"这条链路。
base: ../../stage1_rlvr/config/debug.yaml
model:
  path: ${oc.env:SHENSI_FS,/root/work/filestorage}/models/DeepSeek-V4-Flash-0731
algorithm:
  adv_estimator: grpo
rollout:
  n: 2
  temperature: 1.0
  max_model_len: 2048
  gpu_memory_utilization: 0.3
actor:
  optim:
    lr: 1.0e-5
  ppo_mini_batch_size: 2
  ppo_micro_batch_size_per_gpu: 1
data:
  max_prompt_length: 512
  max_response_length: 128
  train_batch_size: 2
  val_batch_size: 2
trainer:
  total_epochs: 1
  val_before_train: true
  test_freq: -1
  n_gpus_per_node: 1
  nnodes: 1
  logger: '["console"]'
  project_name: shensi_rl
  experiment_name: shensi_stage3_align_debug

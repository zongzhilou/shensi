base: default.yaml

cpt:
  profile: tiny      # stage0_pretrain/stage2_midtrain 的 mock 冒烟档
  tokens: null       # mock 档不按 token 预算换算步数
sft:
  profile: tiny      # stage1_sft 的 mock 冒烟档
rl:
  profile: debug     # 本目录 config/rl/debug.yaml（RL 步要判分端点与 GPU）
bench:
  limit: 5

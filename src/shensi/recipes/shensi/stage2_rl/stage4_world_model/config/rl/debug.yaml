# 极小档：单卡两步，只验证「RL 能起来 + 判分奖励能回传」
base: default.yaml

rollout:
  n: 2
  # 极小档的数据是把 system/每轮都掐过的（data_prep 的 --max-system-chars/--max-turn-chars），
  # prompt ≈1.1k token：本机 16G 卡上真要按原始 9k+ 的 prompt 训，actor 的 CSA 稀疏路径
  # 会把显存撑爆（表现成 "CUDA driver error: device not ready"）。tiny-rl 的
  # max_position_embeddings 仍是 16384（留余量），改大 prompt 时同步抬这里。
  max_model_len: 4096
  # 单卡必须显式写 1：verl 的 RolloutConfig.tensor_model_parallel_size 默认是 2，不给就会在
  # actor_rollout_init_model 里断言 "rollout world_size: 1 is not divisible by infer_world_size: 2"
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  # 本机（RTX 5080 / SM120）上 CUDA graph 的 capture 会失败：
  # "CUDA error: operation not permitted when stream is capturing"
  enforce_eager: true
  # 16G 卡上还得留着 actor + 判分端点（本地 judge 也要 ~2G）：0.6 会把卡压爆，
  # 表现为 actor 前向里的 "CUDA driver error: device not ready"
  gpu_memory_utilization: 0.3
data:
  train_batch_size: 4
  val_batch_size: 2
  max_prompt_length: 3072
  max_response_length: 512
actor:
  ppo_mini_batch_size: 4
trainer:
  total_epochs: 1
  test_freq: 1
  logger: '["console"]'
  experiment_name: shensi_stage2_world_model_rl_debug

# stage1_rlvr：多环境可验证奖励 RL（RLVR，对齐 Nemotron-3 的 21 环境 RLVR 与 GLM-5 的 RLVR 段）。
# stage2_rl 的全量档（verl + Megatron actor）。train.py 读这份，展平成 main_ppo 的命令行覆盖项。
model:
  path: ${oc.env:SHENSI_FS,/root/work/filestorage}/models/DeepSeek-V4-Flash-0731
  enable_gradient_checkpointing: false
  # verl v1 的 engine_config.use_remove_padding 取自**这一段**（engine_workers.py 里
  # `model_config.get("use_remove_padding", False)`），不是 actor.megatron 那段；
  # 而 shensi 的 CSA 在 mcore 里明确不支持 packed sequence（csa.py 的断言），所以必须在这里关掉。
  use_remove_padding: false
algorithm:
  adv_estimator: grpo
  kl_coef: 0.0
rollout:
  name: vllm
  n: 8
  temperature: 1.0
  top_p: 1.0
  max_model_len: 40960
  gpu_memory_utilization: 0.6
  log_prob_micro_batch_size_per_gpu: 1
actor:
  optim:
    # --- 优化器：AdaMuon（矩阵腿）+ AdEMAMix（标量腿），与预训练、SFT 同一套 ---
    optimizer: adaptive_muon
    muon_scalar_optimizer: ademamix    # 换 GrokFastAdamW 就写 grokfastadamw
    muon_momentum: 0.95
    muon_nesterov: true
    muon_scale_mode: spectral
    muon_coefficient_type: polar_express
    muon_num_ns_steps: 5
    muon_extra_scale_factor: 0.18      # 两条腿共用一条 LR 曲线的归一系数
    # Muon 家族下 actor 走 LayerWise 分布式优化器（verl 的 is_muon_layer_wise_config 会自动接）；
    # 关掉 shard-aligned param layout：默认 layout 会把标量腿交给独立的 DistributedOptimizer，
    # 那条路保存优化器状态会撞上游断言（见 stage1_pretrain 档里的说明）
    use_layer_wise_distributed_optimizer: true
    use_layer_wise_param_layout: false
    lr: 1.0e-6
    lr_warmup_steps: 0
    weight_decay: 0.1
    betas: [0.9, 0.999]
    clip_grad: 1.0
  ppo_mini_batch_size: 32
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: false
  megatron:
    use_mbridge: true
  clip_ratio_low: 0.2      # IcePop 式双侧截断（GLM-5 的 ε_low / ε_high）
  clip_ratio_high: 0.28
ref:
  log_prob_micro_batch_size_per_gpu: 1
  megatron:
    use_mbridge: true
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    use_remove_padding: false
reward:
  reward_manager:
    name: naive
data:
  max_prompt_length: 8192
  max_response_length: 32768
  filter_overlong_prompts: true
  truncation: error
  dataloader_num_workers: 0
  train_batch_size: 128
  val_batch_size: 8
trainer:
  total_epochs: 50         # 轮次只是上限：steps 不设限（total_training_steps=null），收尾交给早停看门狗
  val_before_train: true
  test_freq: 20
  n_gpus_per_node: 8
  nnodes: 1
  logger: '["console","wandb"]'
  project_name: shensi_rl
  experiment_name: shensi_stage2_rl_stage1_rlvr
ray_kwargs:
  # 单机内存账：ray 默认起 dashboard（6 个各 ~1.4G 的进程），并按核数预起 python worker
  # （本机 24 核 → 24 个）。47G 的机器上跟 vLLM/megatron 抢内存会直接把节点打到 OOM，
  # 所以关掉 dashboard、把 CPU 数压到 8（预起的 worker 数跟着它走）。
  ray_init:
    include_dashboard: false
    num_cpus: 8
transfer_queue:
  backend:
    SimpleStorage:
      # 默认 8 个 unit、10 万条容量，每个 unit 常驻 ~0.9G；每个 unit 还要占一个 CPU，
      # 所以 unit 数必须明显小于上面的 num_cpus（否则调度不动会卡死）
      num_data_storage_units: 2
      total_storage_size: 1024

# 极小档：1 epoch、小批、少采样，只验"数据 → verl → rollout → 打分"这条链路。
base: default.yaml
model:
  path: ${oc.env:SHENSI_FS,/root/work/filestorage}/models/DeepSeek-V4-Flash-0731
algorithm:
  adv_estimator: grpo
rollout:
  n: 2
  temperature: 1.0
  max_model_len: 2048
  gpu_memory_utilization: 0.3
  tensor_model_parallel_size: 1
  log_prob_micro_batch_size_per_gpu: 1
  max_num_seqs: 8
  max_num_batched_tokens: 2048
  enforce_eager: true
  agent:
    num_workers: 1   # 每个 agent worker 是一个 ~1G 级的进程，极小档 1 个就够
actor:
  optim:
    lr: 1.0e-5
    # 极小档单卡：关掉 LayerWise（default 档开着），走普通 bf16 包装那条路
    use_layer_wise_distributed_optimizer: false
  ppo_mini_batch_size: 2
  ppo_micro_batch_size_per_gpu: 1
  megatron:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    use_distributed_optimizer: false
    use_remove_padding: false
data:
  max_prompt_length: 512
  max_response_length: 128
  train_batch_size: 2
trainer:
  total_epochs: 1
  val_before_train: true
  test_freq: -1
  n_gpus_per_node: 1
  nnodes: 1
  logger: '["console"]'
  project_name: shensi_rl
  experiment_name: shensi_stage1_rlvr_debug

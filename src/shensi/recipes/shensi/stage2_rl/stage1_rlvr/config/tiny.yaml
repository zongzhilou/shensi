base: default.yaml

model:
  path: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/models/tiny-rl
algorithm:
  adv_estimator: grpo
rollout:
  n: 2
  temperature: 1.0
  max_model_len: 2048
  gpu_memory_utilization: 0.3
  tensor_model_parallel_size: 1
  log_prob_micro_batch_size_per_gpu: 1
  max_num_seqs: 8
  max_num_batched_tokens: 2048
  enforce_eager: true           # 冒烟档不走 CUDA graph（小几何上捕获不稳）
  agent:
    num_workers: 1              # 每个 agent worker 是一个 ~1G 级的进程
actor:
  optim:
    lr: 1.0e-5
    use_layer_wise_distributed_optimizer: false   # 单卡冒烟：关掉 LayerWise，走普通 bf16 包装
  ppo_mini_batch_size: 2
  ppo_micro_batch_size_per_gpu: 1
  megatron:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    use_distributed_optimizer: false
    use_remove_padding: false
data:
  max_prompt_length: 512
  max_response_length: 128
  train_batch_size: 2
  val_batch_size: 2
trainer:
  total_epochs: 1
  val_before_train: true
  test_freq: -1
  n_gpus_per_node: 1
  nnodes: 1
  logger: '["console"]'

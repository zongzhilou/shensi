# Shensi 冒烟档：单卡 / 2 层 / hidden 128 / seq 128 / 5 步，mock 数据（不碰真实语料）。
#
# 跑法：`python train.py --smoke`（stage 的 train.py 都会转发到 `common.smoke()`），
# 或手工 `bash <exp_dir>/run.sh`（launcher 会把完整命令写在那里）。
#
# 三条摊平语义（launcher 与 FlagScale 一致，yaml 不用改）：
#   1. bool `False` 会被丢掉 → 要「关掉」写 `no_xxx: true`；
#   2. list 参数摊成 `--key v1 v2 ...` → 对应 argparse 必须 `nargs='+'`；
#   3. 嵌套字典不带前缀摊平 → `checkpoint.save` 就是 `--save`。
defaults:
  - _self_

experiment:
  exp_name: shensi_stage1_rlvr_tiny
  seed: 42
  save_steps: 5
  load: null
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/stage1_rlvr_tiny
  ckpt_format: torch_dist
  runner:
    nnodes: 1
    nproc_per_node: 1
  envs:
    LOGLEVEL: "INFO"
    CUDA_VISIBLE_DEVICES: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    OMP_NUM_THREADS: 4
    TOKENIZERS_PARALLELISM: "false"

train:
  system:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    use_distributed_optimizer: false
    precision:
      bf16: true
      attention_softmax_in_fp32: true
    logging:
      log_interval: 1
    checkpoint:
      save_interval: ${experiment.save_steps}
      load: ${experiment.load}
      ckpt_format: ${experiment.ckpt_format}
      no_save_optim: true
      no_save_rng: true

  model:
    transformer_impl: transformer_engine
    num_layers: 2
    hidden_size: 128
    num_attention_heads: 4
    seq_length: 128
    max_position_embeddings: 128
    norm_epsilon: 1.0e-6
    normalization: RMSNorm
    qk_layernorm: true
    init_method_std: 0.02
    attention_dropout: 0.0
    hidden_dropout: 0.0
    position_embedding_type: rope
    rotary_base: 10000
    swiglu: true
    untie_embeddings_and_output_weights: true
    multi_latent_attention: true
    no_rope_fusion: false
    disable_bias_linear: true
    no_gradient_accumulation_fusion: true   # 本环境无 apex
    # --- Shensi 家族旋钮（train/args.py 里注册的 --shensi-*）---
    shensi_attn_layer_types: compressed_sparse_attention,heavily_compressed_attention
    shensi_mlp_layer_types: hash_moe,moe
    shensi_hc_mult: 16
    shensi_hc_active_streams: 4
    shensi_hc_fixed_streams: 2
    shensi_o_groups: 4
    shensi_sliding_window: 64
    shensi_index_topk: 32
    shensi_num_experts: 8
    shensi_num_experts_per_tok: 2
    shensi_attn_res_block_size: 4
    shensi_erc_loss_coef: 1.0
    shensi_erc_loss_alpha: 0.5
    # --- 训练 ---
    seed: ${experiment.seed}
    finetune: false
    micro_batch_size: 1
    global_batch_size: 2
    eval_iters: 0
    eval_interval: 1000
    train_iters: 5
    optimizer:
      # 与生产档同一套：AdaMuon（矩阵腿）+ AdEMAMix（标量腿）
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_extra_scale_factor: 0.18
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      ademamix_betas: [0.9, 0.95, 0.9999]
      ademamix_alpha: 5.0
      lr_scheduler:
        lr: 1.0e-4
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.0
        lr_decay_style: constant

  data:
    no_create_attention_mask_in_dataloader: true
    reset_position_ids: false
    reset_attention_mask: false
    # mock 数据：冒烟档不碰真实语料
    mock_data: true
    tokenizer:
      tokenizer_type: NullTokenizer
      vocab_size: 128
      make_vocab_size_divisible_by: 128

# stage1_sft 冒烟档：tiny 几何 + 假数据（test_train.py 注入）。
base: default.yaml

experiment:
  exp_name: shensi_vl_stage1_sft_tiny
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/shensi_vl/stage1_sft/tiny

train:
  model:
    llm_path: ${oc.env:SHENSI_VL_TINY_LLM,Qwen/Qwen3-0.6B}
    vision_path: dummy
    allow_random_vision: true
    max_seq_length: 1024
    vocab_size: null
    freeze_vision: true
  optim:
    lr: 1.0e-4
  batch:
    micro_batch_size: 1
    global_batch_size: 2
    train_iters: 3
    save_steps: 100
    eval_steps: 100
  data:
    train_jsonl: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/data/shensi_vl/stage1_sft/tiny.jsonl

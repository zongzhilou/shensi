# 极小档（真实数据）：tiny 几何（小 LM + 随机 ViT）+ 真 grounding 数据跑几十步。
# 先 `data_prep.py --prepare --limit 512`，再 `train.py --profile debug`。
base: default.yaml

experiment:
  exp_name: shensi_vl_stage0_debug
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/shensi_vl/stage0_pretrain/debug

train:
  model:
    llm_path: ${oc.env:SHENSI_VL_TINY_LLM,Qwen/Qwen3-0.6B}
    vision_path: dummy
    allow_random_vision: true
    max_seq_length: 2048
    vocab_size: null
  optim:
    lr: 5.0e-5
  batch:
    global_batch_size: 8
    train_iters: 20
    save_steps: 20
    eval_steps: 10
  data:
    train_jsonl: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/data/shensi_vl/stage0_pretrain/pretrain.jsonl
    val_jsonl: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/data/shensi_vl/stage0_pretrain/pretrain.jsonl

# 冒烟档：mock 不了图像，但可以用 --no-render 之外的假图跑通结构 —— 约定与 shensi 一致：
# tiny = 最小几何 + 合成假数据（stage 的 test_train.py 会先用 synth 造 8 条带图样本再跑 3 步）。
base: default.yaml

experiment:
  exp_name: shensi_vl_stage0_tiny
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/shensi_vl/stage0_pretrain/tiny

train:
  model:
    llm_path: ${oc.env:SHENSI_VL_TINY_LLM,Qwen/Qwen3-0.6B}   # 冒烟用任意小 HF 因果 LM
    vision_path: dummy                                        # 触发随机小 ViT（allow_random_vision 必须开）
    allow_random_vision: true
    freeze_vision: false
    max_seq_length: 1024
    vocab_size: null               # 小 LM 自己的词表 + 7（训练循环按 tokenizer 实际长度对齐）
  optim:
    lr: 1.0e-4
  batch:
    micro_batch_size: 1
    global_batch_size: 2
    train_iters: 3
    save_steps: 100
    eval_steps: 100
  data:
    train_jsonl: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/data/shensi_vl/stage0_pretrain/tiny.jsonl

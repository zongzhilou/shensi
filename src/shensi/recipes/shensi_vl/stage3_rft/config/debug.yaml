# stage3_rft 极小档（真实数据）。
base: default.yaml

experiment:
  exp_name: shensi_vl_stage3_rft_debug
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/shensi_vl/stage3_rft/debug

train:
  model:
    llm_path: ${oc.env:SHENSI_VL_TINY_LLM,Qwen/Qwen3-0.6B}
    vision_path: dummy
    allow_random_vision: true
    max_seq_length: 2048
    vocab_size: null
  optim:
    lr: 5.0e-5
  batch:
    global_batch_size: 8
    train_iters: 20
    save_steps: 20
    eval_steps: 10

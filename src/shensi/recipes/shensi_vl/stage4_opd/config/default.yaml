# stage4_opd：On-Policy Distillation（论文 §2.5.4）。
# 学生 = RFT 统一模型 F；教师 = {E_TwG, E_TwP}（等权两教师）；反向 KL、全词表 logits；
# 轨迹 = 学生自采样（stage4_opd/data_prep.py）。配置与 SFT 同一套，只换损失与数据。
experiment:
  exp_name: shensi_vl_stage4_opd
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/runs/shensi_vl/stage4_opd

train:
  model:
    llm_path: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/shensi_vl/stage3_rft/final   # 学生起点 = F
    extend_tokenizer: true
    vocab_size: 129287
    max_seq_length: 16384
    dtype: bfloat16
    autocast_dtype: bfloat16
    allow_random_vision: false
    freeze_vision: true
  optim:
    lr: 1.0e-5
    min_lr: 1.0e-6
    weight_decay: 0.0
    betas: [0.9, 0.95]
    clip_grad: 1.0
    warmup_ratio: 0.01
  batch:
    micro_batch_size: 1           # 教师前向的全词表 logits 很吃显存：micro 压 1，靠累积上量
    global_batch_size: 16
    train_iters: 3000
    save_steps: 300
    eval_steps: 200
    log_steps: 5
    num_workers: 4
  opd:
    kl_coef: 1.0
    weights: [0.5, 0.5]           # {E_TwG, E_TwP} 等权（论文未给 wᵢ 取值，等权为默认口径）
    teachers:
      - ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/shensi_vl/stage2_rl/stage1_grounding/final   # E_TwG
      - ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/shensi_vl/stage2_rl/stage2_pointing/final    # E_TwP
  data:
    train_jsonl: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/data/shensi_vl/stage4_opd/opd_train.jsonl
    val_jsonl: null

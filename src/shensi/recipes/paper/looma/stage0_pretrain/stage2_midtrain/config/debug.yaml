# stage2_midtrain · 极小档（真实语料的 tiny 几何，接续段用 --load）。
base: ../../stage1_pretrain/config

experiment:
  exp_name: looma_debug_mid
  ckpt_format: torch

train:
  model:
    num_layers: 8  # 比 tiny 档深：debug 阶段看深度连接在更深堆叠上的行为
    hidden_size: 256
    ffn_hidden_size: 768
    num_attention_heads: 4
    num_query_groups: 2
    kv_channels: 64
    seq_length: 512
    max_position_embeddings: 4096
    micro_batch_size: 1
    global_batch_size: 16
    train_iters: 200
    eval_iters: 10
    eval_interval: 200
    optimizer:
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18
      ademamix_betas: [0.9, 0.95, 0.9999]
      ademamix_alpha: 5.0
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 6.0e-5
        min_lr: 6.0e-5
        lr_warmup_fraction: 0.02
        lr_decay_style: constant

# stage1_pretrain · 发布形状档：几何与 default 同源（MiniCPM5-2B 的 config.json），
# 只把层数回到官方的 42（default 是 7 层的对比档）；词表沿用同一份 tokenizer（130,560）。
# 上下文原生 131,072（非事后外推）；Mid-2 用 seq 32768 向长上下文渐进。
experiment:
  exp_name: looma_base_minicpm5_2b

train:
  model:
    num_layers: 42
    hidden_size: 2048
    ffn_hidden_size: 6144
    num_attention_heads: 16
    num_query_groups: 2
    kv_channels: 128
    seq_length: 8192
    max_position_embeddings: 131072
    global_batch_size: 512
    eval_iters: 20
    eval_interval: 500

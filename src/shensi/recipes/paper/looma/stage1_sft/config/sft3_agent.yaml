# stage1_sft · SFT-2 agent 段（UltraData-SFT-Agent-2609，同 SFT-1 规格）。
#
# 从 SFT-2 的 ckpt 接续（--load）；数据切 Agent 集（data_prep.py --prepare --blend agent.json
# → train.py --profile sft3_agent --data-jsonl <...>/sft_train_agent.jsonl）。
# 两个 SFT 段同量同配——架构对比要求两个变体同配（RECIPE.md §4）。
experiment:
  exp_name: looma_base_sft3_agent
  save_steps: 500

train:
  model:
    train_iters: 1000
    optimizer:
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18
      ademamix_betas: [0.9, 0.95, 0.9999]
      ademamix_alpha: 5.0
      lr_scheduler:
        lr: 2.0e-5
        min_lr: 2.0e-6
        lr_warmup_fraction: 0.01
        lr_decay_style: cosine

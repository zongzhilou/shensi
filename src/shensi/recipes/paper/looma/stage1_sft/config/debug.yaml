# stage1_sft · 极小档（真实 messages jsonl 的 tiny 几何）。
#
# 数据走 data_prep.py --prepare --limit 20 的产物（sft_train.jsonl）；
# SFTTokenizer + MiniCPM5-2B chat 模板 + 上游打包 SFTDataset 的组合在这里验证。
base: ../../stage0_pretrain/stage1_pretrain/config

experiment:
  exp_name: looma_debug_sft
  save_steps: 5
  ckpt_format: torch

train:
  model:
    sft: true
    sft_tokenizer_prompt_format: default
    num_layers: 8  # B<L：主行 block B=4，层数必须大于 block（否则连接惰性）
    hidden_size: 256
    ffn_hidden_size: 768
    num_attention_heads: 4
    num_query_groups: 2
    kv_channels: 64
    seq_length: 1024
    max_position_embeddings: 4096
    micro_batch_size: 1
    global_batch_size: 2
    train_iters: 5
    eval_iters: 0
    eval_interval: 1000
    optimizer:
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18
      ademamix_betas: [0.9, 0.95, 0.9999]
      ademamix_alpha: 5.0
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 1.0e-4
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.0
        lr_decay_style: constant

  data:
    no_create_attention_mask_in_dataloader: true
    split: 1
    tokenizer:
      tokenizer_type: SFTTokenizer

# stage1_sft · SFT-1 deep-thinking 段（UltraData-SFT-2605 的 deep-thinking 子集，200B）。
#
# MiniCPM5-2B 口径：SFT 共 400B = 200B deep-thinking（本档）+ 200B hybrid-thinking
# （sft2_hybrid.yaml），随后 sft3_agent.yaml 走 UltraData-SFT-Agent-2609。
#
# 几何/融合开关继承 stage1_pretrain（base: 引用）；这里改 SFT 口径：
# `sft: true`（不打包口径：ShensiSFTDataset 一条对话一条样本 + 右 padding；
# local 注意力不吃 THD 打包）+ SFTTokenizer
# （prompt_format=default = tokenizer 自带的 MiniCPM5-2B chat 模板）+ seq 8192
# （0.6B 对比档；旗舰 8B 的 400B-token SFT 用 32K packing，见 README）。
# LR：2e-5 cosine → 2e-6（RECIPE.md §4 的 SFT 口径），warmup 1%，1 epoch。
# 接续：--load <Mid-2 ckpt>；数据：data_prep.py 产出的 sft_train.jsonl（train.py 注入）。
base: ../../stage0_pretrain/stage1_pretrain/config

experiment:
  exp_name: looma_base_sft1_deepthink
  save_steps: 500
  early_stop:
    metric: lm loss value   # 见 common.early_stop_plan 的口径说明
    mode: min
    patience: 15
    grace: 1200

train:
  model:
    sft: true
    sft_tokenizer_prompt_format: default
    seq_length: 8192
    max_position_embeddings: 16384
    micro_batch_size: 1
    global_batch_size: 64
    train_iters: 1000000      # 无限大：收敛与收尾交给早停（--tokens 会覆盖）
    eval_iters: 20
    eval_interval: 200
    optimizer:
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18
      ademamix_betas: [0.9, 0.95, 0.9999]
      ademamix_alpha: 5.0
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 2.0e-5
        min_lr: 2.0e-6
        lr_warmup_fraction: 0.01
        lr_decay_style: cosine

  data:
    no_create_attention_mask_in_dataloader: true
    split: 1
    tokenizer:
      tokenizer_type: SFTTokenizer

# PT 档：LCS-558k，只训 projector（freeze: vision+llm）；batch 256 / lr 1e-3 / cosine / warmup 0.03 / 1 epoch。
experiment:
  exp_name: deeprecur_pt
  seed: 42
  save_steps: 500
  eval_interval: 200
  early_stop: 5

paper:
  arxiv: "2406.04334"
  vision_encoder: CLIP-large-336
  stacking:
    block_length: 1
    n_stack_layers: 4
    sampling: 2d_spatial_4neighbor
    resize: consistent
    global_tokens: 576
    effective_tokens: 2880
    hd_tokens: 14400

model:
  variant: unified               # unified（encoder-free）| native（Qwen3-VL）| deeprecur | gdar
  visual_token_budget: 1120      # unified 臂的视觉 token 预算
  recur_blocks: null             # 两塔共享的递归块数（deeprecur/gdar 臂；8B 口径 = 9）
  placeholder:
    name: Qwen/Qwen3-VL-8B-Instruct
    load: null
  tiny: false
  dtype: bfloat16
  attn_implementation: sdpa
  max_length: 2048

train:
  freeze: [vision, llm]        # PT 只训 projector
  global_batch_size: 256
  micro_batch_size: 8
  epochs: 1
  lr: 1.0e-3
  vision_lr: null
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: false
  logging_steps: 10
  assumed_seq_length: 512      # --tokens 换算 max_steps 的估序长

data:
  jsonl: null                  # data_prep 产物，train.py 自动注入
  val_jsonl: null
  num_workers: 4

# SFT 档：LLaVA-mixed-665k，解冻 LLM（freeze: vision）；batch 128 / lr 2e-5 / cosine / warmup 0.03 / 1 epoch。
experiment:
  exp_name: deeprecur_sft
  seed: 42
  save_steps: 500
  eval_interval: 200
  early_stop: 5

paper:
  arxiv: "2406.04334"
  stacking:
    block_length: 1
    n_stack_layers: 4
    sampling: 2d_spatial_4neighbor
    resize: consistent
    global_tokens: 576
    effective_tokens: 2880
    hd_tokens: 14400

model:
  variant: unified               # unified（encoder-free）| native（Qwen3-VL）| deeprecur | gdar
  visual_token_budget: 1120
  recur_blocks: null             # 两塔共享的递归块数（deeprecur/gdar 臂；8B 口径 = 9）
  placeholder:
    name: Qwen/Qwen3-VL-8B-Instruct
    load: null
  tiny: false
  dtype: bfloat16
  attn_implementation: sdpa
  max_length: 2048

train:
  freeze: [vision]             # 解冻 LLM + projector
  global_batch_size: 128
  micro_batch_size: 4
  epochs: 1
  lr: 2.0e-5
  vision_lr: null              # sft_v 档设 2e-6（视觉编码器分组学习率）
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  assumed_seq_length: 1536

data:
  jsonl: null
  val_jsonl: null
  num_workers: 4

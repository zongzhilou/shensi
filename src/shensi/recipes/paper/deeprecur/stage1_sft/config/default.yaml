# stage1_sft · 论文 SFT 档（instruction tuning：LLaVA-mixed-665k，解冻 LLM）。
#
# 论文（arXiv 2406.04334, DeepStack）§4.1 + Table 10 "DeepStack SFT" 列：
#   global batch 128 / lr 2e-5 / cosine decay / warmup ratio 0.03 / 1 epoch / AdamW，
#   "we unfreeze LLM"，视觉编码器冻结（DeepStack-V/HD 变体才解冻，见 sft_v.yaml）。
# 数据：data_prep.py 产出的 stage1_sft_train.jsonl（train.py 注入）。
# 接续：--load <stage0_pt 检查点>（HF 格式目录）。
experiment:
  exp_name: deeprecur_sft
  seed: 42
  save_steps: 500
  eval_interval: 200
  early_stop: 5

paper:
  arxiv: "2406.04334"
  stacking:
    block_length: 1
    n_stack_layers: 4
    sampling: 2d_spatial_4neighbor
    resize: consistent
    global_tokens: 576
    effective_tokens: 2880
    hd_tokens: 14400

model:
  variant: unified               # unified（去 deepstack + Gemma4 式 token 预算）| native（Qwen 原生）
  visual_token_budget: 1120      # Gemma 4 离散档 {70, 140, 280, 560, 1120}
  placeholder:
    name: Qwen/Qwen3-VL-8B-Instruct   # 论文是 Vicuna-7B/13B + CLIP；先以 Qwen3-VL 暂代
    load: null                        # --load 覆写（接 PT 产物）
  tiny: false
  dtype: bfloat16
  attn_implementation: sdpa
  max_length: 2048

train:
  freeze: [vision]             # 解冻 LLM+projector，视觉编码器冻结（论文口径）
  global_batch_size: 128
  micro_batch_size: 4
  epochs: 1
  lr: 2.0e-5
  vision_lr: null              # sft_v.yaml 里设 2e-6（视觉编码器分组学习率）
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true # 8B 全量微调默认开
  logging_steps: 10
  assumed_seq_length: 1536     # --tokens 换 max_steps 的工程换算

data:
  jsonl: null
  val_jsonl: null
  num_workers: 4

# 规模阶梯几何档：4B（层数/宽度/GQA 见下）。
# 训练预算：50B tokens / seq 4096 / peak LR 3e-4 / warmup 1%（单 seed）。
# 用法：train.py --profile geoms/qwen3_4b --model-algo <臂> --tokens <预算>
experiment:
  exp_name: gdar_qwen3_4b

train:
  model:
    num_layers: 36
    hidden_size: 2560
    ffn_hidden_size: 9728
    num_attention_heads: 32
    num_query_groups: 8
    kv_channels: 128
    seq_length: 4096
    max_position_embeddings: 32768
    global_batch_size: 128
    optimizer:
      optimizer: adaptive_muon
      muon_scalar_optimizer: ademamix
      muon_num_ns_steps: 5
      muon_coefficient_type: polar_express
      muon_scale_mode: spectral
      muon_momentum: 0.95
      muon_nesterov: true
      muon_tp_mode: distributed
      muon_extra_scale_factor: 0.18
      ademamix_betas: [0.9, 0.95, 0.9999]
      ademamix_alpha: 5.0
      lr_scheduler:
        lr: 3.0e-4
        min_lr: 3.0e-4

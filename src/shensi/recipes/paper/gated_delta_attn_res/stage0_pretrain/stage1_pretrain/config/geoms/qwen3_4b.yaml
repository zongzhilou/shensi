# 规模阶梯的几何档（Qwen3 4b 官方几何；设计 EXPERIMENT_MATRIX.md §2）。
# 训练预算：50B tokens / seq 4096 / peak LR 3e-4 / warmup 1%（单 seed）。
# 用法：train.py --profile geoms/qwen3_4b --model-algo <臂> --tokens <预算>
experiment:
  exp_name: gdar_qwen3_4b

train:
  model:
    num_layers: 36
    hidden_size: 2560
    ffn_hidden_size: 9728
    num_attention_heads: 32
    num_query_groups: 8
    kv_channels: 128
    seq_length: 4096
    max_position_embeddings: 32768
    global_batch_size: 128
    optimizer:
      lr_scheduler:
        lr: 3.0e-4
        min_lr: 3.0e-4

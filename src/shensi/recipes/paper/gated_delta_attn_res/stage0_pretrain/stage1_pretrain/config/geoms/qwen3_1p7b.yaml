# 规模阶梯的几何档（Qwen3 1p7b 官方几何；设计 EXPERIMENT_MATRIX.md §2）。
# 训练预算：20B tokens / seq 2048 / peak LR 4e-4 / warmup 1%（单 seed）。
# 用法：train.py --profile geoms/qwen3_1p7b --model-algo <臂> --tokens <预算>
experiment:
  exp_name: gdar_qwen3_1p7b

train:
  model:
    num_layers: 28
    hidden_size: 2048
    ffn_hidden_size: 6144
    num_attention_heads: 16
    num_query_groups: 8
    kv_channels: 128
    seq_length: 2048
    max_position_embeddings: 32768
    global_batch_size: 128
    optimizer:
      lr_scheduler:
        lr: 4.0e-4
        min_lr: 4.0e-4

# critic（value/GAE）口径 —— token 级 credit assignment 的另一条路（JustRL II 式）。
# 与 GRPO 的差别：advantage 由学习到的 value 给出（gae），适合长 CoT 的稀疏奖励。

base: default.yaml     # 只写相对 default 的变化（_load_with_base 深合并）
algorithm:
  adv_estimator: gae
critic:
  # critic 的起点由 train.py 注入（critic.model.path = actor 的 model.path）
  optim:
    lr: 1.0e-6
    lr_warmup_steps: 0
    weight_decay: 0.1
    betas: [0.9, 0.999]
    clip_grad: 1.0
  ppo_micro_batch_size_per_gpu: 1
  megatron:
    use_mbridge: true

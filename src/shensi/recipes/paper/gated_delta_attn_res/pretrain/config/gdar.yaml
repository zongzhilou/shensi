# GDAR 配方 · 论文主行（RECIPE.md §6.2 的主配置）。
#
# 与 default.yaml（base 对照臂）**只差 --spec 这一处**：`gdar_layer_spec_paper`
# = objective 闭式更新 + 衰减阶梯 64 + address=delta + 8 读头 + Softmax₁ + 全白化
# + 低秩 64 + decay 正性投影；恒等初始化保证 GDAR(0) ≡ plain Qwen3 逐位成立
# （用 `python -m ...train.checks` 验证，34/34 逐位 / logits 0.000e+00 是包里的实测口径）。
#
# 注意：spec 的层规格是 local 子模块——`train.model.transformer_impl` 必须保持 default
# 里的 `local`，不要切回 transformer_engine。
experiment:
  exp_name: gdar_paper

train:
  model:
    spec:
      - shensi.recipes.paper.gated_delta_attn_res.models.gdar_spec
      - gdar_layer_spec_paper

# Shensi 极小规模（单卡 / 2 层 / hidden 128 / seq 128 / 5 步）FlagScale task yaml。
#
# 跑法（与 9b_a4b 同一条命令，只换档）：
#   cd <flagscale_runtime> && python -m flagscale.run \
#       --config-path examples/shensi/conf --config-name train train=tiny
#
# 三个已知坑（本轮都踩过，这里已规避）：
#     会被 flagscale 生成的 run script 覆盖（它自己 export PYTHONPATH={pkg_dir}:...）；
#  2. bool `False` 会被 flatten_dict_to_args 丢掉，所以"关掉"一律写成 `no_xxx: true`；
#  3. list 参数会被摊成 `--key v1 v2 ...`，对应 argparse 必须 `nargs='+'`（train_shensi.py 已照做）。
#
# 结构说明：`_get_args_megatron` 只读 `config.train.{system,model,data}` 并把它们摊成 megatron CLI，
# 所以三块都写在 `train:` 下。
defaults:
  - _self_

experiment:
  exp_name: shensi_tiny_flagscale
  seed: 42
  save_steps: 5
  load: null
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/flagscale_exp/shensi_tiny
  ckpt_format: torch
  task:
    type: train
    backend: megatron
    # 相对 pkg_dir（flagscale_runtime）的路径；flagscale 会把 {pkg_dir}/flagscale/train 加进 PYTHONPATH
    entrypoint: flagscale/train/megatron/train_shensi.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    hostfile: null
    nnodes: 1
    nproc_per_node: 1
  envs:
    LOGLEVEL: "INFO"
    CUDA_VISIBLE_DEVICES: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    OMP_NUM_THREADS: 4
    TOKENIZERS_PARALLELISM: "false"

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra

train:
  system:
    no_shared_fs: ${experiment.runner.no_shared_fs}
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    use_distributed_optimizer: false
    precision:
      bf16: true
      attention_softmax_in_fp32: true
    logging:
      log_interval: 1
    checkpoint:
      save_interval: ${experiment.save_steps}
      load: ${experiment.load}
      ckpt_format: ${experiment.ckpt_format}
      no_save_optim: true
      no_save_rng: true

  model:
    transformer_impl: transformer_engine
    num_layers: 2
    hidden_size: 128
    num_attention_heads: 4
    seq_length: 128
    max_position_embeddings: 128
    norm_epsilon: 1.0e-6
    normalization: RMSNorm
    qk_layernorm: true
    init_method_std: 0.02
    attention_dropout: 0.0
    hidden_dropout: 0.0
    position_embedding_type: rope
    rotary_base: 10000
    swiglu: true
    untie_embeddings_and_output_weights: true
    multi_latent_attention: true
    # mcore 的布尔坑：False 会被 flatten 丢掉 -> 要表达"关掉"的开关都写成 no_xxx: true
    no_rope_fusion: true
    disable_bias_linear: true
    no_gradient_accumulation_fusion: true   # 本环境无 apex
    # --- Shensi 家族旋钮（train_shensi.py 里注册的 --shensi-*）---
    shensi_attn_layer_types: compressed_sparse_attention,heavily_compressed_attention
    shensi_mlp_layer_types: hash_moe,moe
    shensi_hc_mult: 16
    shensi_hc_active_streams: 4
    shensi_hc_fixed_streams: 2
    shensi_o_groups: 4
    shensi_sliding_window: 64
    shensi_index_topk: 32
    shensi_num_experts: 8
    shensi_num_experts_per_tok: 2
    shensi_attn_res_block_size: 4
    shensi_erc_loss_coef: 1.0
    shensi_erc_loss_alpha: 0.5
    # --- 训练 ---
    seed: ${experiment.seed}
    finetune: false
    micro_batch_size: 1
    global_batch_size: 2
    eval_iters: 0
    eval_interval: 1000
    train_iters: 5
    optimizer:
      clip_grad: 1.0
      weight_decay: 0.0
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 1.0e-4
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.0
        lr_decay_style: constant

  data:
    reset_position_ids: false
    reset_attention_mask: false
    # --- mock 数据（铁规矩：不碰真实数据）---
    mock_data: true
    tokenizer:
      tokenizer_type: NullTokenizer
      vocab_size: 128
      make_vocab_size_divisible_by: 128

# Shensi 全量规模（V4-Flash 几何 / 1M 上下文 / aux+ERC 全开）FlagScale task yaml。
#
# 模型参数 = `ShensiConfig`（transformers/models/shensi/configuration_shensi.py）的默认值，
# 层计划 = config.json 的 `compress_ratios`（35 个主干层 + 1 个 MTP 层），
# tokenizer = ModelScope 上的 `deepseek-ai/DeepSeek-V4-Flash`（`train.data.tokenizer`）。
#
# 跑法（几何对拍会在起训前逐字段核对本 yaml 与 config.json，因此先跑 tiny 版验流程）：
#   cd <flagscale_runtime> && python -m flagscale.run \
#       --config-path examples/shensi/conf --config-name train
#
# 表达"关掉"要写 `no_xxx: true`（bool False 会被 flatten 丢掉）；list 参数走 `--key v1 v2`。
defaults:
  - _self_

experiment:
  exp_name: shensi_9b_a4b
  seed: 42
  save_steps: 1000
  load: null
  exp_dir: ${oc.env:SHENSI_FS,/root/work/filestorage}/shensi/ckpt/flagscale_exp/shensi_9b_a4b
  ckpt_format: torch
  # 本文件所在目录（config.json 与它同放）；改成集群上的副本路径即可
  shensi_conf_dir: ${oc.env:SHENSI_ROOT,/root/work/shensi}/3rdparty/common/FlagScale/examples/shensi/conf
  # DSV4-Flash 的 tokenizer 目录（ModelScope）：
  #   modelscope download --model deepseek-ai/DeepSeek-V4-Flash --local_dir <dir>
  # 目录里含 tokenizer.json / tokenizer_config.json，走 HuggingFaceTokenizer（AutoTokenizer）
  tokenizer_dir: ${oc.env:HOME}/.cache/modelscope/hub/models/deepseek-ai/DeepSeek-V4-Flash
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/megatron/train_shensi.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    hostfile: null
    nnodes: 1
    nproc_per_node: 8
  envs:
    LOGLEVEL: "INFO"
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    OMP_NUM_THREADS: 4
    TOKENIZERS_PARALLELISM: "false"

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra

train:
  system:
    no_shared_fs: ${experiment.runner.no_shared_fs}
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    # 256 专家的 MoE 按 EP=8 起；集群不同就改这一项
    expert_model_parallel_size: 8
    context_parallel_size: 1
    sequence_parallel: false
    use_distributed_optimizer: true
    precision:
      bf16: true
      attention_softmax_in_fp32: true
    logging:
      log_interval: 1
    checkpoint:
      save_interval: ${experiment.save_steps}
      load: ${experiment.load}
      ckpt_format: ${experiment.ckpt_format}

  model:
    transformer_impl: transformer_engine
    # --- 主干几何（= ShensiConfig 默认值）---
    num_layers: 35
    mtp_num_layers: 3
    mtp_use_repeated_layer: true      # GLM-5 的 MTP 参数共享：3 层共享一份参数
    hidden_size: 2560
    num_attention_heads: 32
    seq_length: 1048576
    max_position_embeddings: 1048576
    norm_epsilon: 1.0e-6
    normalization: RMSNorm
    qk_layernorm: true
    init_method_std: 0.02
    attention_dropout: 0.0
    hidden_dropout: 0.0
    position_embedding_type: rope
    # 滑窗层走 rope_theta；compressor 层走 compress_rope_theta(160000) + YaRN(factor 16)，
    # 由 config.json 的 rope_parameters 对拍（64K -> 1M）
    rotary_base: 10000
    rotary_scaling_factor: 16
    original_max_position_embeddings: 65536
    mscale: 1.0
    swiglu: true
    untie_embeddings_and_output_weights: true
    multi_latent_attention: true
    # mcore 的布尔坑：False 会被 flatten 丢掉 -> 要表达"关掉"的开关都写成 no_xxx: true
    no_rope_fusion: true
    disable_bias_linear: true
    no_gradient_accumulation_fusion: true
    # --- Shensi 家族旋钮（train_shensi.py 里注册的 --shensi-*）---
    # 逐层压缩比（0=滑窗 / 4=CSA / 128=HCA），长度 = 35 主干层 + 3 MTP 层（MTP 走参数共享）
    shensi_compress_ratios: 0,0,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,128,4,0,0,0,0,0
    # 前 3 层 hash_moe、其余 moe（= HF default_num_hash_layers）
    shensi_mlp_layer_types: hash_moe,hash_moe,hash_moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe,moe
    shensi_hc_mult: 16
    shensi_hc_active_streams: 4
    shensi_hc_fixed_streams: 2
    shensi_hc_conv_kernels: [4, 8, 12]
    shensi_head_dim: 512
    shensi_q_lora_rank: 640
    shensi_o_groups: 4
    shensi_o_lora_rank: 640
    shensi_partial_rotary_factor: 0.125
    shensi_moe_intermediate_size: 1280
    shensi_routed_expert_hidden_size: 640
    shensi_sliding_window: 128
    shensi_index_topk: 512
    shensi_index_n_heads: 64
    shensi_index_head_dim: 128
    shensi_num_experts: 256
    shensi_num_experts_per_tok: 6
    shensi_attn_res_block_size: 4
    # 与 config.json 逐字段对拍（缺字段/不一致直接报错，是权威侧的 config.json 说了算）
    shensi_hf_config: ${experiment.shensi_conf_dir}/9b_a4b.json
    # --- 三个 loss 全开，系数各按各的论文推荐值 ---
    moe_aux_loss_coeff: 0.001          # DeepSeek-V3 的 aux loss 权重 = config.json 的 router_aux_loss_coef
    shensi_erc_loss_coef: 1.0          # ERC loss 权重（HF `erc_loss_coef` 默认值）
    shensi_erc_loss_alpha: 0.5         # ERC 锚定系数（HF `erc_loss_alpha` 默认值）
    shensi_indexer_loss_coeff: 0.01    # DSA indexer 的 KL 项（论文 §2.1；本栈 DSA 家族配置同值）
    # --- 训练（规模相关项是占位，按实际改）---
    seed: ${experiment.seed}
    finetune: false
    micro_batch_size: 1
    global_batch_size: 512
    eval_iters: 0
    eval_interval: 1000
    train_iters: 100000
    optimizer:
      clip_grad: 1.0
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 1.0e-4
        min_lr: 1.0e-5
        lr_warmup_fraction: 0.01
        lr_decay_style: cosine

  data:
    reset_position_ids: false
    reset_attention_mask: false
    # 真实数据（占位路径，按集群上的预处理产物改；geometry 对拍与此无关）
    mock_data: false
    data_path: /data/shensi/pretrain/mmap_index/merged_0000
    split: 98,1,1
    tokenizer:
      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: ${experiment.tokenizer_dir}
      vocab_size: 129280
      make_vocab_size_divisible_by: 128
